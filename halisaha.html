<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halı Saha</title>

<style>
body{
    margin:0;
    background:#0b1020;
    color:white;
    font-family:Arial;
}

/* LOGIN */
#login{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.loginBox{
    width:80%;
    background:#1f2937;
    padding:20px;
    border-radius:15px;
}

/* APP */
#app{ display:none; }

/* GRID */
.container{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    padding:10px;
}

/* KART */
.kart{
    padding:12px;
    border-radius:15px;
    text-align:center;
    position:relative;
    box-shadow:0 0 8px rgba(0,0,0,0.6);
    background-size:cover;
    background-position:center;
}

/* overlay */
.kart::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.55);
    border-radius:15px;
}

/* içerik üstte */
.kart *{
    position:relative;
    z-index:2;
}

/* RESİM */
img{
    width:80px;
    height:80px;
    border-radius:50%;
}

/* INPUT */
input{
    width:100%;
    padding:8px;
    margin:5px 0;
    border-radius:8px;
    border:none;
}

/* BUTTON */
button{
    width:100%;
    padding:10px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:white;
}

/* ⭐ YILDIZ */
.yildiz{
    font-size:18px;
    cursor:pointer;
    color:#555;
}
.yildiz.aktif{
    color:#FFD700;
}

/* 🏆 BADGE */
.badge{
    position:absolute;
    bottom:8px;
    left:8px;
    background:#FFD700;
    color:black;
    padding:2px 6px;
    border-radius:6px;
    font-size:11px;
    font-weight:bold;
}

/* PUAN */
.buyukPuan{
    position:absolute;
    top:8px;
    right:10px;
    font-size:22px;
    font-weight:bold;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<div class="loginBox">
<h3>⚽ Giriş</h3>
<input id="kullanici" placeholder="Kullanıcı">
<input id="sifre" type="password" placeholder="Şifre">
<button onclick="giris()">Giriş</button>
</div>
</div>

<!-- APP -->
<div id="app">

<div style="padding:10px;">
<button onclick="window.location.href='index.html'">⬅️</button>
</div>

<div id="adminPanel" style="display:none;padding:10px;">
<input id="yeniOyuncu" placeholder="Oyuncu adı">
<button onclick="oyuncuEkle()">Oyuncu Ekle</button>
</div>

<div class="container" id="alan"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
apiKey:"AIzaSy...",
authDomain:"ukasa1.firebaseapp.com",
projectId:"ukasa1"
});

const db = getFirestore(app);

let state={};
let alan=document.getElementById("alan");

/* PERSONEL */
let personeller=[];
onSnapshot(doc(db,"kasa","personel"),snap=>{
if(snap.exists()) personeller=snap.data().liste;
});

/* GİRİŞ */
window.giris=function(){

let k=document.getElementById("kullanici").value.trim().toLowerCase();
let s=document.getElementById("sifre").value.trim();

let admin={k:"admin",s:"1234"};

if(k===admin.k && s===admin.s){
baslat(k,true);
return;
}

let bulundu=personeller.find(p=>p.k===k && p.s===s);

if(!bulundu){
alert("Hatalı giriş");
return;
}

baslat(k,false);
}

/* BAŞLAT */
function baslat(kullanici,adminMi){

localStorage.setItem("kullanici",kullanici);

document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";

if(adminMi) document.getElementById("adminPanel").style.display="block";

const ref=doc(db,"kasa","halisaha");

onSnapshot(ref,(snap)=>{
state=snap.exists()?snap.data().data:{};
ciz(kullanici,adminMi);
});
}

/* ORTALAMA */
function ortalama(eski,yeni){
yeni=parseInt(yeni||0);
return Math.round((eski + yeni)/2);
}

/* KART */
function ciz(kullanici,adminMi){

alan.innerHTML="";

Object.keys(state).forEach(key=>{

let k=state[key];

let pas=k.pas||0;
let sut=k.sut||0;
let calim=k.calim||0;
let kosu=k.kosu||0;

let genel=Math.round((pas+sut+calim+kosu)/4);

/* kart */
let div=document.createElement("div");
div.className="kart";

/* arka plan */
if(k.bg){
div.style.backgroundImage=`url(${k.bg})`;
}else{
let renk="#374151";
if(genel>=80) renk="#FFD700";
else if(genel>=60) renk="#22c55e";
else if(genel>=40) renk="#f97316";

div.style.background=`linear-gradient(135deg,${renk},#111)`;
}

/* puan */
let puan=document.createElement("div");
puan.className="buyukPuan";
puan.innerText=genel;
div.appendChild(puan);

/* badge */
let badge=document.createElement("div");
badge.className="badge";
badge.innerText=genel>=80?"ELİT":genel>=60?"İYİ":genel>=40?"ORTA":"AMATÖR";
div.appendChild(badge);

/* resim */
let img=document.createElement("img");
img.src=k.resim||"https://via.placeholder.com/80";
div.appendChild(img);

/* OWNER */
if(kullanici===k.owner){

/* profil resmi */
let file=document.createElement("input");
file.type="file";
file.onchange=e=>{
let reader=new FileReader();
reader.onload=()=>{
state[key].resim=reader.result;
kaydet();
}
reader.readAsDataURL(e.target.files[0]);
};
div.appendChild(file);

/* 🔥 ARKA PLAN */
let bg=document.createElement("input");
bg.type="file";
bg.onchange=e=>{
let reader=new FileReader();
reader.onload=()=>{
state[key].bg=reader.result;
kaydet();
}
reader.readAsDataURL(e.target.files[0]);
};
div.appendChild(bg);
}

/* isim */
let isim=document.createElement("h4");
isim.innerText=k.isim;
div.appendChild(isim);

/* stat */
let stat=document.createElement("div");
stat.innerHTML=`
Pas: ${pas}<br>
Şut: ${sut}<br>
Çalım: ${calim}<br>
Koşu: ${kosu}
`;
div.appendChild(stat);

/* ⭐ PUAN */
if(kullanici!==k.owner){

let son=k.puanlayanlar?.[kullanici]||0;
let now=Date.now();
let izin=(now-son)>604800000;

let btn=document.createElement("button");
btn.innerText=izin?"Puan Ver":"1 Hafta";
btn.disabled=!izin;

let panel=document.createElement("div");
panel.style.display="none";

function yildiz(label){
let wrap=document.createElement("div");
wrap.innerHTML="<b>"+label+"</b><br>";
let val=0;

for(let i=1;i<=5;i++){
let y=document.createElement("span");
y.innerText="★";
y.className="yildiz";

y.onclick=()=>{
val=i;
wrap.querySelectorAll(".yildiz").forEach((el,ix)=>{
el.classList.toggle("aktif",ix<i);
});
};

wrap.appendChild(y);
}

return {el:wrap,get:()=>val*20};
}

let p=yildiz("Pas");
let s=yildiz("Şut");
let c=yildiz("Çalım");
let kY=yildiz("Koşu");

let kaydetBtn=document.createElement("button");
kaydetBtn.innerText="Kaydet";

kaydetBtn.onclick=()=>{
state[key].pas=ortalama(pas,p.get());
state[key].sut=ortalama(sut,s.get());
state[key].calim=ortalama(calim,c.get());
state[key].kosu=ortalama(kosu,kY.get());

state[key].puanlayanlar=state[key].puanlayanlar||{};
state[key].puanlayanlar[kullanici]=now;

kaydet();
panel.style.display="none";
};

panel.append(p.el,s.el,c.el,kY.el,kaydetBtn);

btn.onclick=()=>{
panel.style.display = panel.style.display==="none"?"block":"none";
};

div.appendChild(btn);
div.appendChild(panel);
}

/* admin */
if(adminMi){
let sil=document.createElement("button");
sil.innerText="Sil";
sil.onclick=()=>{
delete state[key];
kaydet();
};
div.appendChild(sil);
}

alan.appendChild(div);

});
}

/* KAYDET */
async function kaydet(){
await setDoc(doc(db,"kasa","halisaha"),{data:state});
}

/* EKLE */
window.oyuncuEkle=function(){
let isim=yeniOyuncu.value.trim().toLowerCase();
if(!isim) return;

state[isim]={isim:isim,owner:isim,pas:0,sut:0,calim:0,kosu:0};

yeniOyuncu.value="";
kaydet();
}

</script>

</body>
</html>
