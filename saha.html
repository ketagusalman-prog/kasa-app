<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saha</title>

<style>
body{margin:0;background:#0b1020;color:white;font-family:Arial;}

.saha{
height:100vh;
background:linear-gradient(#0f5132,#198754);
position:relative;
padding:10px;
overflow:hidden;
}

.ortaCizgi{
position:absolute;top:50%;left:0;width:100%;height:2px;
background:white;opacity:0.5;
}

.ortaYuvarlak{
position:absolute;top:50%;left:50%;
transform:translate(-50%,-50%);
width:120px;height:120px;
border:2px solid white;border-radius:50%;opacity:0.5;
}

.kale{
position:absolute;width:160px;height:60px;
border:4px solid white;left:50%;
transform:translateX(-50%);
}
.kale.ust{top:0;}
.kale.alt{bottom:0;}

.takim{
position:absolute;width:100%;
display:flex;flex-direction:column;align-items:center;
}

.beyaz{top:5%;}
.siyah{bottom:5%;}

.satir{display:flex;justify-content:center;gap:12px;margin:6px;}

.oyuncu{display:flex;flex-direction:column;align-items:center;font-size:11px;}

.oyuncu img{
width:55px;height:55px;border-radius:50%;
object-fit:cover;border:2px solid white;
}

.isim{font-weight:bold;}
.puan{font-size:10px;opacity:0.8;}

.takimPuan{
position:absolute;
right:10px;
font-size:14px;
background:rgba(0,0,0,0.5);
padding:5px 10px;
border-radius:10px;
}
.puanBeyaz{top:45%;}
.puanSiyah{bottom:45%;}
</style>
</head>

<body>

<div style="position:absolute;z-index:10;padding:10px;">
<button onclick="window.location.href='halisaha.html'">⬅️</button>
</div>

<div id="saha"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
apiKey:"AIzaSy...",
authDomain:"ukasa1.firebaseapp.com",
projectId:"ukasa1"
});

const db = getFirestore(app);

/* PUAN */
function genel(k){
return Math.round(((k.pas||0)+(k.sut||0)+(k.calim||0)+(k.kosu||0))/4);
}

/* TAKIM */
function dengeliTakim(state){

let tumOyuncular = Object.keys(state)
.filter(key=>{
let k = state[key];

/* ❌ OYNAYAMAYANLAR %100 DIŞARI */
if(String(k.oynayamaz) === "true") return false;

/* güvenlik */
if(!k.isim) return false;

return true;
})
.map(key=>{
let k=state[key];
return {
isim:k.isim,
mevki:k.mevki||"Orta Saha",
puan:genel(k),
resim:k.resim || "https://via.placeholder.com/50"
};
});

/* UYARI */
if(tumOyuncular.length < 16){
alert("⚠️ Yeterli oyuncu yok! (Minimum 16 gerekli)");
}

/* KALECİ AYIR */
let kaleciler = tumOyuncular.filter(o=>o.mevki==="Kaleci");
let digerleri = tumOyuncular.filter(o=>o.mevki!=="Kaleci");

/* sırala */
kaleciler.sort((a,b)=>b.puan-a.puan);
digerleri.sort((a,b)=>b.puan-a.puan);

/* TAKIM */
let A=[],B=[];
let sumA=0,sumB=0;

/* 🧤 KALECİLERİ GARANTİ YERLEŞTİR */
if(kaleciler[0]){ A.push(kaleciler[0]); sumA+=kaleciler[0].puan; }
if(kaleciler[1]){ B.push(kaleciler[1]); sumB+=kaleciler[1].puan; }

/* kalan oyuncular */
let oyuncular = digerleri.slice(0,16 - (A.length + B.length));

oyuncular.forEach(o=>{
if(sumA<=sumB){
A.push(o); sumA+=o.puan;
}else{
B.push(o); sumB+=o.puan;
}
});

return {A,B,sumA,sumB};
}

/* DİZİLİŞ */
function diz(t){

let kaleci=t.filter(x=>x.mevki==="Kaleci").slice(0,1);
let def=t.filter(x=>x.mevki==="Defans").slice(0,4);
let orta=t.filter(x=>x.mevki==="Orta Saha").slice(0,3);
let forvet=t.filter(x=>x.mevki==="Forvet").slice(0,3);

let kalan=t.filter(x=>!kaleci.includes(x)&&!def.includes(x)&&!orta.includes(x)&&!forvet.includes(x));

function doldur(arr,max){
while(arr.length<max && kalan.length){
arr.push(kalan.shift());
}
}

doldur(kaleci,1);
doldur(def,4);
doldur(orta,3);
doldur(forvet,3);

return {kaleci,def,orta,forvet};
}

/* HTML */
function oyuncuHTML(o){
return `
<div class="oyuncu">
<img src="${o.resim}">
<div class="isim">${o.isim}</div>
<div class="puan">${o.puan}</div>
</div>`;
}

function satir(arr){
return arr.map(o=>oyuncuHTML(o)).join("");
}

/* ÇİZ */
function sahaCiz(state){

let t=dengeliTakim(state);
let A=diz(t.A);
let B=diz(t.B);

document.getElementById("saha").innerHTML=`

<div class="saha">

<div class="ortaCizgi"></div>
<div class="ortaYuvarlak"></div>

<div class="kale ust"></div>
<div class="kale alt"></div>

<div class="takimPuan puanBeyaz">⚪ ${t.sumA}</div>
<div class="takimPuan puanSiyah">⚫ ${t.sumB}</div>

<div class="takim beyaz">
<h3>⚪ Beyaz</h3>
<div class="satir">${satir(A.forvet)}</div>
<div class="satir">${satir(A.orta)}</div>
<div class="satir">${satir(A.def)}</div>
<div class="satir">${satir(A.kaleci)}</div>
</div>

<div class="takim siyah">
<div class="satir">${satir(B.forvet)}</div>
<div class="satir">${satir(B.orta)}</div>
<div class="satir">${satir(B.def)}</div>
<div class="satir">${satir(B.kaleci)}</div>
<h3>⚫ Siyah</h3>
</div>

</div>
`;
}

/* FIREBASE */
onSnapshot(doc(db,"kasa","halisaha"),snap=>{
let state=snap.exists()?snap.data().data:{};
sahaCiz(state);
});

</script>

</body>
</html>
