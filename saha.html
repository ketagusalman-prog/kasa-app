<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saha</title>

<style>
body{margin:0;background:#0b1020;color:white;font-family:Arial;}

.saha{height:100vh;background:linear-gradient(#0f5132,#198754);position:relative;overflow:hidden;}

.ortaCizgi{position:absolute;top:50%;width:100%;height:2px;background:white;opacity:0.5;}
.ortaYuvarlak{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
width:100px;height:100px;border:2px solid white;border-radius:50%;opacity:0.5;}

.kale{position:absolute;width:140px;height:50px;border:4px solid white;left:50%;transform:translateX(-50%);}
.kale.ust{top:0;}
.kale.alt{bottom:0;}

.takim{position:absolute;width:100%;height:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.beyaz{top:0;}
.siyah{bottom:0;}

.satir{display:flex;gap:6px;margin:4px;flex-wrap:wrap;}
.oyuncu{text-align:center;font-size:10px;}
.oyuncu img{width:45px;height:45px;border-radius:50%;border:2px solid white;}

.takimPuan{position:absolute;right:10px;background:#0008;padding:4px 8px;border-radius:10px;}
.puanBeyaz{top:45%;}
.puanSiyah{bottom:45%;}

/* ⏳ SAYAÇ */
#ustBilgi{
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
background:#0008;
padding:8px 15px;
border-radius:10px;
font-size:14px;
z-index:20;
}

/* ⚽ SONUÇ */
#sonucYazi{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:28px;
font-weight:bold;
background:#000a;
padding:10px 20px;
border-radius:15px;
z-index:30;
}
</style>
</head>

<body>

<div id="ustBilgi">⏳ Yükleniyor...</div>
<div id="sonucYazi"></div>

<div id="saha"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
apiKey:"AIzaSy...",
authDomain:"ukasa1.firebaseapp.com",
projectId:"ukasa1"
});

const db = getFirestore(app);

let macData={};

onSnapshot(doc(db,"kasa","mac"),snap=>{
macData = snap.exists()?snap.data():{};
});

/* ⏳ GERİ SAYIM */
function geriSayim(){

if(!macData.tarih || !macData.saat){
document.getElementById("ustBilgi").innerText="📅 Maç ayarlanmadı";
return;
}

let hedef = new Date(macData.tarih+"T"+macData.saat);
let now = new Date();
let fark = hedef - now;

if(fark <= 0){
document.getElementById("ustBilgi").innerText="🏁 Maç zamanı!";
return;
}

let gun = Math.floor(fark/86400000);
let saat = Math.floor((fark%86400000)/3600000);
let dk = Math.floor((fark%3600000)/60000);

let kilit = fark <= 172800000;

document.getElementById("ustBilgi").innerText =
(kilit ? "🔒 Kilitli " : "⏳ ") + gun+"g "+saat+"s "+dk+"dk";
}
setInterval(geriSayim,1000);

/* PUAN */
function genel(k){
let base = Math.round(((k.pas||0)+(k.sut||0)+(k.calim||0)+(k.kosu||0))/4);

if(macData.sonuc && macData.takimlar){
let kazanan = macData.sonuc.kazanan;
let A = macData.takimlar.A || [];
let B = macData.takimlar.B || [];

let takim = A.find(x=>x.isim===k.isim) ? "A" :
B.find(x=>x.isim===k.isim) ? "B" : null;

if(takim){
if(takim === kazanan) base -= 2;
else base += 2;
}
}
return base;
}

/* SONUÇ GÖSTER */
function sonucGoster(){
if(!macData.sonuc) return;
document.getElementById("sonucYazi").innerText =
macData.sonuc.beyaz + " - " + macData.sonuc.siyah;
}

/* TAKIM */
function dengeliTakim(state){

let oyuncular = Object.keys(state)
.filter(k=>!state[k].oynayamaz)
.map(k=>({
isim:state[k].isim,
mevki:state[k].mevki||"Orta Saha",
puan:genel(state[k]),
resim:state[k].resim||"https://via.placeholder.com/50"
}))
.sort((a,b)=>b.puan-a.puan)
.slice(0,16);

let A=[],B=[],sumA=0,sumB=0;

/* KALECİ */
let kaleciler = oyuncular.filter(o=>o.mevki==="Kaleci");
if(kaleciler[0]){A.push(kaleciler[0]);sumA+=kaleciler[0].puan;}
if(kaleciler[1]){B.push(kaleciler[1]);sumB+=kaleciler[1].puan;}

/* FORVET */
let forvetler = oyuncular.filter(o=>o.mevki==="Forvet");
if(forvetler[0]&&!A.includes(forvetler[0])){A.push(forvetler[0]);sumA+=forvetler[0].puan;}
if(forvetler[1]&&!B.includes(forvetler[1])){B.push(forvetler[1]);sumB+=forvetler[1].puan;}

/* GARANTİ */
if(!A.find(x=>x.mevki==="Kaleci")){
let k=oyuncular.find(o=>o.mevki==="Kaleci"&&!B.includes(o));
if(k){A.push(k);sumA+=k.puan;}
}
if(!B.find(x=>x.mevki==="Kaleci")){
let k=oyuncular.find(o=>o.mevki==="Kaleci"&&!A.includes(o));
if(k){B.push(k);sumB+=k.puan;}
}

if(!A.find(x=>x.mevki==="Forvet")){
let f=oyuncular.find(o=>o.mevki==="Forvet"&&!B.includes(o));
if(f){A.push(f);sumA+=f.puan;}
}
if(!B.find(x=>x.mevki==="Forvet")){
let f=oyuncular.find(o=>o.mevki==="Forvet"&&!A.includes(o));
if(f){B.push(f);sumB+=f.puan;}
}

/* DENGELİ DAĞIT */
oyuncular.forEach(o=>{
if(A.includes(o)||B.includes(o)) return;

if(A.length<8 && (sumA<=sumB || B.length>=8)){
A.push(o); sumA+=o.puan;
}else if(B.length<8){
B.push(o); sumB+=o.puan;
}
});

return {A,B,sumA,sumB};
}

/* DİZİLİŞ */
function diz(t){
let kaleci=t.filter(x=>x.mevki==="Kaleci").slice(0,1);
let def=t.filter(x=>x.mevki==="Defans").slice(0,4);
let orta=t.filter(x=>x.mevki==="Orta Saha").slice(0,3);
let forvet=t.filter(x=>x.mevki==="Forvet").slice(0,3);

let kalan=t.filter(x=>!kaleci.includes(x)&&!def.includes(x)&&!orta.includes(x)&&!forvet.includes(x));

function doldur(arr,max){
while(arr.length<max && kalan.length){
arr.push(kalan.shift());
}
}

doldur(kaleci,1);
doldur(def,4);
doldur(orta,3);
doldur(forvet,3);

return {kaleci,def,orta,forvet};
}

/* ÇİZ */
function sahaCiz(state){

let t=dengeliTakim(state);
let A=diz(t.A);
let B=diz(t.B);

function html(o){
return `<div class="oyuncu">
<img src="${o.resim}">
<div>${o.isim}</div>
<div>${o.puan}</div>
</div>`;
}

function satir(arr){
return arr.map(html).join("");
}

document.getElementById("saha").innerHTML=`
<div class="saha">

<div class="ortaCizgi"></div>
<div class="ortaYuvarlak"></div>

<div class="kale ust"></div>
<div class="kale alt"></div>

<div class="takimPuan puanBeyaz">⚪ ${t.sumA}</div>
<div class="takimPuan puanSiyah">⚫ ${t.sumB}</div>

<div class="takim beyaz">
<h3>⚪ Beyaz</h3>
<div class="satir">${satir(A.kaleci)}</div>
<div class="satir">${satir(A.def)}</div>
<div class="satir">${satir(A.orta)}</div>
<div class="satir">${satir(A.forvet)}</div>
</div>

<div class="takim siyah">
<div class="satir">${satir(B.forvet)}</div>
<div class="satir">${satir(B.orta)}</div>
<div class="satir">${satir(B.def)}</div>
<div class="satir">${satir(B.kaleci)}</div>
<h3>⚫ Siyah</h3>
</div>

</div>`;

sonucGoster();
}

/* DATA */
onSnapshot(doc(db,"kasa","halisaha"),snap=>{
let state=snap.exists()?snap.data().data:{};
sahaCiz(state);
});

</script>

</body>
</html>
