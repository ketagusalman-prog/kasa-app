<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M4 Operasyonel Raporlama Paneli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .main-container { max-width: 1300px; margin: 30px auto; padding: 25px; background: #1e293b; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); }
        .filter-panel { background: #161e31; padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); margin-bottom: 25px; }
        .checkbox-group { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 10px; padding: 12px; background: rgba(0,0,0,0.2); border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        
        /* GİZLİLİK VE FLU (BLUR) ETKİSİ */
        .flu-hucre {
            filter: blur(5.5px) !important;
            opacity: 0.18 !important;
            pointer-events: none !important;
            user-select: none !important;
            transition: all 0.3s ease;
        }
        
        /* Giriş yapan personelin satır tasarımı */
        .kendi-satirim {
            background-color: rgba(59, 130, 246, 0.15) !important;
            border-left: 5px solid #3b82f6 !important;
        }
        .kendi-satirim td {
            color: #fff !important;
        }
        
        .user-welcome { background: rgba(59, 130, 246, 0.1); color: #60a5fa; padding: 10px 15px; border-radius: 8px; font-weight: 600; display: inline-block; margin-bottom: 15px; border: 1px solid rgba(59, 130, 246, 0.2); }
        
        .table { color: #cbd5e1; }
        .table-dark { --bs-table-bg: #0f172a; }
        .form-select, .form-control { background-color: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: #fff; }
        .form-select:focus, .form-control:focus { background-color: rgba(0,0,0,0.3); color: #fff; border-color: #3b82f6; box-shadow: none; }
        .form-check-input:checked { background-color: #3b82f6; border-color: #3b82f6; }
        
        .loading-overlay { display: none; text-align: center; padding: 20px; font-weight: 600; color: #60a5fa; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="main-container">
        
        <div class="d-flex justify-content-between align-items-center flex-wrap">
            <h2 class="fw-bold text-white">📊 Detaylı Operasyon Raporları (Kişiye Özel Görünüm)</h2>
            <div id="welcomeMessage" class="user-welcome">
                👤 Tanımlanıyor...
            </div>
        </div>
        <hr style="background-color: rgba(255,255,255,0.15);">

        <div class="filter-panel">
            <h5 class="mb-3 fw-bold" style="color: #60a5fa;">🔍 Filtreleme ve Görünüm Seçenekleri</h5>
            
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label text-secondary"><b>Mağaza Bölgesi:</b></label>
                    <select id="filterMagaza" class="form-select" onchange="filtreleVeGuncelle()">
                        <option value="">Tümü (Yükleniyor...)</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label text-secondary"><b>Çalışma Grubu:</b></label>
                    <select id="filterGrup" class="form-select" onchange="filtreleVeGuncelle()">
                        <option value="">Tümü (Yükleniyor...)</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label text-secondary"><b>Vardiya Tipi:</b></label>
                    <select id="filterVardiya" class="form-select" onchange="filtreleVeGuncelle()">
                        <option value="">Tümü (Yükleniyor...)</option>
                    </select>
                </div>
            </div>

            <div class="row mt-2">
                <div class="col-12">
                    <label class="form-label text-secondary"><b>Kendi Verilerinizden Herkesin Görmesini İstediklerinizi Açın (Kapatırsanız Diğerlerine Flu Gözükür):</b></label>
                    <div class="checkbox-group">
                        <div class="form-check form-switch ms-2">
                            <input class="form-check-input" type="checkbox" id="chkFis" onchange="kisiselAyarlariKaydet()">
                            <label class="form-check-label fw-bold text-light" for="chkFis">🎟️ Fiş Bilgim Herkese Açık</label>
                        </div>
                        <div class="form-check form-switch ms-4">
                            <input class="form-check-input" type="checkbox" id="chkKasaOnu" onchange="kisiselAyarlariKaydet()">
                            <label class="form-check-label fw-bold text-light" for="chkKasaOnu">💰 Kasa Önü Satışım Herkese Açık</label>
                        </div>
                        <div class="form-check form-switch ms-4">
                            <input class="form-check-input" type="checkbox" id="chkPerformans" onchange="kisiselAyarlariKaydet()">
                            <label class="form-check-label fw-bold text-light" for="chkPerformans">⚡ Performans Skorum Herkese Açık</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="loadingArea" class="loading-overlay">
            <div class="spinner-border spinner-border-sm me-2" role="status"></div>
            Canlı Veritabanından Operasyon Raporları Çekiliyor, Lütfen Bekleyin...
        </div>

        <div class="table-responsive">
            <table class="table table-bordered table-dark table-striped align-middle" id="raporTablosu" style="border-color: rgba(255,255,255,0.05);">
                <thead>
                    <tr>
                        <th>Personel Adı</th>
                        <th>Mağaza</th>
                        <th>Grup</th>
                        <th>Vardiya</th>
                        <th>Fiş Sayısı</th>
                        <th>Kasa Önü Satış (TL)</th>
                        <th>Performans Skoru</th>
                    </tr>
                </thead>
                <tbody id="tabloGövde"></tbody>
            </table>
        </div>

        <div class="d-flex gap-2">
            <button onclick="ozetProfiliDon()" class="btn btn-outline-info btn-sm mt-3 fw-bold">⬅️ Özet Profilime Dön</button>
            <button onclick="guvenliCikis()" class="btn btn-outline-danger btn-sm mt-3 fw-bold">🔒 Güvenli Çıkış</button>
        </div>

    </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxHcRJq3_P4xFG6nxJLC2DSOZlKYTvN7chT8vzJW2max4ocH4a3hch1waYS5CoRpfB_MA/exec";

let tumVeriler = []; 
let guncelKur = 36.50; 

const aktifKullanici = sessionStorage.getItem("aktifKullaniciIsim"); 

document.addEventListener("DOMContentLoaded", async () => {
    const welcomeDiv = document.getElementById("welcomeMessage");
    
    if (!aktifKullanici) {
        alert("Bu rapora erişmek için önce M4 Portal girişi yapmalısınız!");
        window.location.href = "./index.html";
        return;
    }

    welcomeDiv.innerHTML = `👤 Hoş geldiniz, <b>${aktifKullanici}</b>`;
    await canlıVerileriYukle();
});

async function canlıVerileriYukle() {
    const loadingArea = document.getElementById("loadingArea");
    loadingArea.style.display = "block";

    try {
        const response = await fetch(SCRIPT_URL);
        const jsonResponse = await response.json();
        
        if (jsonResponse && jsonResponse.kur) {
            guncelKur = parseFloat(String(jsonResponse.kur).replace(/\s/g, "").replace(",", "."));
        }
        tumVeriler = jsonResponse.data || [];

        const kendim = tumVeriler.find(x => String(x.isim || x.ad || "").trim().toLowerCase() === aktifKullanici.trim().toLowerCase());
        if(kendim) {
            document.getElementById('chkFis').checked = String(kendim.goster_fis).toLowerCase() === "true" || kendim.goster_fis === true;
            document.getElementById('chkKasaOnu').checked = String(kendim.goster_kasaonu).toLowerCase() === "true" || kendim.goster_kasaonu === true;
            document.getElementById('chkPerformans').checked = String(kendim.goster_perf).toLowerCase() === "true" || kendim.goster_perf === true;
        }

        filtreleriDoldur(tumVeriler);
        tabloyuDoldur(tumVeriler);
    } catch (err) {
        console.error("Hata:", err);
        document.getElementById("tabloGövde").innerHTML = `<tr><td colspan="7" class="text-center text-danger fw-bold">Veriler alınırken hata oluştu!</td></tr>`;
    } finally {
        loadingArea.style.display = "none";
    }
}

function filtreleriDoldur(veriler) {
    if (!veriler || veriler.length === 0) return;

    const magazalar = [...new Set(veriler.map(x => String(x.magaza || "").trim()).filter(Boolean))];
    const gruplar = [...new Set(veriler.map(x => String(x.grup || "").trim()).filter(Boolean))];
    const vardiyalar = [...new Set(veriler.map(x => String(x.vardiya || "").trim()).filter(Boolean))];

    const mSelect = document.getElementById("filterMagaza");
    const gSelect = document.getElementById("filterGrup");
    const vSelect = document.getElementById("filterVardiya");

    mSelect.innerHTML = '<option value="">Tümü</option>';
    gSelect.innerHTML = '<option value="">Tümü</option>';
    vSelect.innerHTML = '<option value="">Tümü</option>';

    magazalar.forEach(m => mSelect.innerHTML += `<option value="${m}">${m}</option>`);
    gruplar.forEach(g => gSelect.innerHTML += `<option value="${g}">${g} Grubu</option>`);
    vardiyalar.forEach(v => vSelect.innerHTML += `<option value="${v}">${v}</option>`);
}

function tabloyuDoldur(veriler) {
    const tbody = document.getElementById("tabloGövde");
    tbody.innerHTML = "";

    if(!veriler || veriler.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">Kayıt bulunamadı.</td></tr>`;
        return;
    }

    const n = (v) => {
        if (v === undefined || v === null) return 0;
        return parseFloat(String(v).replace(/\s/g, "").replace(",", ".")) || 0;
    };

    let skorluVeriler = veriler.map(item => {
        let fisSayisi = n(item.fis);
        let tlSatis = n(item.tl);
        let euroSatis = n(item.euro);
        let toplamCiro = tlSatis + (euroSatis * guncelKur);
        let vardiyaMetni = (item.vardiya || "").toLowerCase();

        let baseScore = ((fisSayisi * 1.5) * 0.60) + ((toplamCiro / 1500) * 0.40);
        let finalScore = vardiyaMetni.includes("gece") ? baseScore * 1.25 : baseScore;

        return {
            ...item,
            hesaplanmisFis: fisSayisi,
            hesaplanmisCiro: toplamCiro,
            performansSkoru: finalScore
        };
    });

    skorluVeriler.sort((a, b) => b.performansSkoru - a.performansSkoru);

    skorluVeriler.forEach(item => {
        let pIsim = item.isim || item.ad || "---";
        let isOwnRow = (pIsim.trim().toLowerCase() === aktifKullanici.trim().toLowerCase());
        let rowClass = isOwnRow ? "kendi-satirim fw-bold" : "";
        
        let gosterFis = String(item.goster_fis).toLowerCase() === "true" || item.goster_fis === true;
        let gosterKasaOnu = String(item.goster_kasaonu).toLowerCase() === "true" || item.goster_kasaonu === true;
        let gosterPerf = String(item.goster_perf).toLowerCase() === "true" || item.goster_perf === true;

        let fisFluClass = (isOwnRow ? document.getElementById('chkFis').checked : gosterFis) ? "" : "flu-hucre";
        let kasaOnuFluClass = (isOwnRow ? document.getElementById('chkKasaOnu').checked : gosterKasaOnu) ? "" : "flu-hucre";
        let perfFluClass = (isOwnRow ? document.getElementById('chkPerformans').checked : gosterPerf) ? "" : "flu-hucre";

        let row = `<tr class="${rowClass}">
            <td>👤 ${pIsim} ${isOwnRow ? ' <span class="badge bg-primary">Siz</span>' : ''}</td>
            <td><span class="badge bg-secondary">${item.magaza || "---"}</span></td>
            <td>${item.grup || "-"} Grubu</td>
            <td>${item.vardiya || "---"}</td>
            <td class="${fisFluClass}">${Math.round(item.hesaplanmisFis)}</td>
            <td class="${kasaOnuFluClass}">${Math.round(item.hesaplanmisCiro).toLocaleString('tr-TR')} ₺</td>
            <td class="${perfFluClass} text-success fw-bold">${item.performansSkoru.toFixed(2)}</td>
        </tr>`;
        tbody.innerHTML += row;
    });
}

async function kisiselAyarlariKaydet() {
    const fisAcikmi = document.getElementById('chkFis').checked;
    const kasaOnuAcikmi = document.getElementById('chkKasaOnu').checked;
    const perfAcikmi = document.getElementById('chkPerformans').checked;

    let kendim = tumVeriler.find(x => String(x.isim || x.ad || "").trim().toLowerCase() === aktifKullanici.trim().toLowerCase());
    if(kendim) {
        kendim.goster_fis = fisAcikmi;
        kendim.goster_kasaonu = kasaOnuAcikmi;
        kendim.goster_perf = perfAcikmi;
    }

    const hucreler = document.querySelectorAll('#tabloGövde tr.kendi-satirim td');
    if(hucreler.length > 0) {
        if(fisAcikmi) hucreler[4].classList.remove('flu-hucre'); else hucreler[4].classList.add('flu-hucre');
        if(kasaOnuAcikmi) hucreler[5].classList.remove('flu-hucre'); else hucreler[5].classList.add('flu-hucre');
        if(perfAcikmi) hucreler[6].classList.remove('flu-hucre'); else hucreler[6].classList.add('flu-hucre');
    }

    try {
        await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({
                islem: "gorunurlukGuncelle",
                kullaniciIsim: aktifKullanici,
                gosterFis: fisAcikmi,
                gosterKasaOnu: kasaOnuAcikmi,
                gosterPerf: perfAcikmi
            })
        });
    } catch (e) {
        console.error("Görünürlük ayarı senkronize edilemedi:", e);
    }
}

function filtreleVeGuncelle() {
    const secilenMagaza = document.getElementById("filterMagaza").value.toLowerCase();
    const secilenGrup = document.getElementById("filterGrup").value.toLowerCase();
    const secilenVardiya = document.getElementById("filterVardiya").value.toLowerCase();

    let filtrelenmisVeri = tumVeriler.filter(item => {
        let mMagaza = (item.magaza || "").toLowerCase();
        let mGrup = (item.grup || "").toLowerCase();
        let mVardiya = (item.vardiya || "").toLowerCase();

        let magazaUyum = secilenMagaza === "" || mMagaza.trim() === secilenMagaza.trim();
        let grupUyum = secilenGrup === "" || mGrup.trim() === secilenGrup.trim();
        let vardiyaUyum = secilenVardiya === "" || mVardiya.trim() === secilenVardiya.trim();
        
        return magazaUyum && grupUyum && vardiyaUyum;
    });

    tabloyuDoldur(filtrelenmisVeri);
}

// ARTIK GÜVENLE GERİ DÖNEBİLİRİZ
function ozetProfiliDon() {
    // Tarayıcı geçmişinde bir adım geriye (yani butonun basıldığı sayfaya) atar
    history.back();
}

function guvenliCikis() {
    sessionStorage.clear();
    window.location.href = "./kisiselp.html";
}
</script>

</body>
</html>
