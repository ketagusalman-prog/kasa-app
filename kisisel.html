<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Kişisel Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { 
            --bg: #0b0f1a; --card: rgba(22, 30, 49, 0.85); --accent: #3b82f6; 
            --text: #ffffff; --border: rgba(255, 255, 255, 0.1);
            --danger: #ef4444; --success: #10b981; --warning: #f59e0b;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0;
        }

        /* Telefon Çerçevesi */
        .phone {
            width: 100%; max-width: 414px; height: 100vh;
            background: #000; position: relative;
            overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        /* Uygulama İçeriği */
        .app {
            width: 100%; height: 100%;
            background: radial-gradient(circle at top right, #1e293b, #020617);
            overflow-y: auto; padding: 20px 15px 100px 15px;
            scrollbar-width: none;
        }
        .app::-webkit-scrollbar { display: none; }

        .topbar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; padding-top: env(safe-area-inset-top);
        }

        .topbar h3 { font-weight: 800; font-size: 20px; color: var(--accent); }

        /* 🔥 Mesaj Bildirimi Animasyonu */
        .alertBlink {
            background: var(--danger); color: white;
            padding: 4px 10px; border-radius: 12px;
            font-size: 12px; font-weight: 800;
            animation: blink 1s infinite;
        }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        #sayac { font-weight: 800; min-width: 25px; text-align: center; }

        /* Giriş Ekranı */
        input { 
            width: 100%; padding: 15px; margin: 10px 0; 
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); 
            border-radius: 15px; color: white; font-family: inherit; outline: none;
        }

        button { 
            width: 100%; padding: 14px; border-radius: 15px; border: none; 
            font-weight: 800; color: white; cursor: pointer; transition: 0.3s;
            font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-primary { background: var(--accent); }
        .btn-green { background: var(--success); }
        .btn-outline { background: transparent; border: 1px solid var(--border); margin-bottom: 5px; }

        /* Kartlar */
        .kart { 
            background: var(--card); padding: 20px; border-radius: 24px; 
            margin-top: 15px; border: 1px solid var(--border); 
            backdrop-filter: blur(10px);
        }
        .kart h3 { font-size: 16px; margin-bottom: 12px; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .kart p { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; color: #94a3b8; }
        .kart p b { color: white; font-weight: 600; }

        .high { color: var(--success) !important; }
        .low { color: var(--danger) !important; }

        .yeniMesaj { border-left: 4px solid var(--danger) !important; }

        canvas { margin: 20px 0; max-height: 250px; }

        .section-title { font-size: 14px; font-weight: 800; margin: 30px 0 10px 5px; color: var(--warning); display: block; }

        .mesaj-btn-group { display: flex; gap: 8px; margin-top: 12px; }
        .mesaj-btn-group button { padding: 8px; font-size: 11px; }
    </style>
</head>

<body>

<div class="phone">
<div class="app">

    <div class="topbar">
        <h3>⚡ PANEL</h3>
        <div id="sayac"></div>
    </div>

    <div id="setup"></div>
    
    <div id="kart"></div>
    
    <canvas id="grafik"></canvas>

    <div id="mesajBolumu">
        <span class="section-title">📩 MESAJLAR</span>
        
        <div style="display:flex; gap:8px;">
            <button class="btn-outline" onclick="tumunuSil()">🧹 TÜMÜNÜ SİL</button>
            <button class="btn-outline" onclick="okunanlariSil()">✔ OKUNANLAR</button>
        </div>

        <div id="mesajAlani"></div>
    </div>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "ukasa1.firebaseapp.com",
  projectId: "ukasa1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let kullanici = (localStorage.getItem("kullanici") || "").toLowerCase().trim();
const URL = "https://script.google.com/macros/s/AKfycbxODlNf0yl2oAtkd5oMw1ghWavKSOO8TmT81uAUN8Oiqbj8yzx81x7iRexwcAHo7ecv4g/exec";

let tumData = [];

init();

function init(){
    if(!kullanici){
        document.getElementById("setup").innerHTML = `
        <div class="kart">
            <h3>HOŞ GELDİNİZ</h3>
            <input id="nameInput" placeholder="İsminizi giriniz...">
            <button class="btn-primary" onclick="saveUser()">KAYDET</button>
        </div>`;
        document.getElementById("mesajBolumu").style.display = "none";
    } else {
        veriCek();
    }
}

window.saveUser = function(){
    let val = document.getElementById("nameInput").value.toLowerCase().trim();
    if(!val) return alert("İsim gir");
    localStorage.setItem("kullanici", val);
    location.reload();
}

function veriCek(){
    fetch(URL)
    .then(res => res.json())
    .then(data => {
        tumData = data.filter(x => x.isim && x.isim.trim() !== "");
        render();
    });
}

function render(){
    let kisi = tumData.find(x => x.isim.toLowerCase().trim() === kullanici);

    if(!kisi){
        document.getElementById("kart").innerHTML = `<div class="kart" style="text-align:center;">Veri bulunamadı ❌</div>`;
        return;
    }

    let avg = tumData.reduce((a,b)=>a+Number(b.kpuan||0),0) / tumData.length;

    document.getElementById("kart").innerHTML = `
    <div class="kart">
        <h3>👤 ${kisi.isim.toUpperCase() || "İsimsiz"}</h3>
        <p>🏢 Ay: <b>${kisi.ay1 || "-"}</b></p>
        <p>🆔 Sicil: <b>${kisi.sicil || "-"}</b></p>
        <p>🧾 Fiş Sayısı: <b>${kisi.fis1 || "-"}</b></p>
        <p>📊 Satır Sayısı: <b>${kisi.satirSayisi || "-"}</b></p>
        <p>⏱️ Fiş Başı Süre: <b>${kisi.fisBasiSure || "-"}</b></p>
        <p>⭐ Kartezyen Puan: <b class="${kisi.kpuan>=avg?'high':'low'}">${kisi.kpuan || "-"}</b></p>
        <p>📅 Dönem: <b>${kisi.ay || "-"}</b></p>
        <p>💰 TL Hakediş: <b>${kisi.tl || "-"}</b></p>
        <p>🤑 Euro Hakediş: <b>${kisi.euro || "-"}</b></p>
        <p>🔢 Toplam Adet: <b>${kisi.adet || "-"}</b></p>
    </div>`;

    drawChart(kisi, avg);
}

function drawChart(kisi, avg){
    new Chart(document.getElementById("grafik"), {
        type:"doughnut",
        data:{
            labels:["Sen","Ortalama"],
            datasets:[{
                data:[kisi.kpuan || 0, avg],
                backgroundColor: ['#3b82f6', 'rgba(255,255,255,0.05)'],
                borderColor: ['#3b82f6', 'rgba(255,255,255,0.1)'],
                borderWidth: 1
            }]
        },
        options: {
            plugins: { legend: { labels: { color: 'white', font: { family: 'Plus Jakarta Sans'} } } }
        }
    });
}

const mesajRef = doc(db, "mesajlar", kullanici);

onSnapshot(mesajRef, (snap)=>{
    if(!snap.exists()) return;
    let data = snap.data().liste || [];
    let div = document.getElementById("mesajAlani");
    let sayac = document.getElementById("sayac");
    div.innerHTML = "";
    let okunmamis = 0;

    data.slice().reverse().forEach((m,index)=>{
        let realIndex = data.length - 1 - index;
        if(!m.okundu) okunmamis++;

        let d = document.createElement("div");
        d.className = "kart " + (!m.okundu ? "yeniMesaj" : "");
        d.innerHTML = `
            <p style="color:white; justify-content:flex-start;">${m.text}</p>
            <small style="font-size:10px; opacity:0.5; margin-top:5px; display:block;">🕒 ${new Date(m.tarih).toLocaleString()}</small>
            <div class="mesaj-btn-group">
                ${!m.okundu ? `<button class="btn-green" onclick="okunduYap(${realIndex})">OKUNDU</button>` : ""}
                <button class="btn-outline" style="margin:0" onclick="silMesaj(${realIndex})">SİL</button>
            </div>
        `;
        div.appendChild(d);
    });

    if(okunmamis > 0){
        sayac.classList.add("alertBlink");
        sayac.innerText = okunmamis;
    } else {
        sayac.classList.remove("alertBlink");
        sayac.innerText = "";
    }
});

window.okunduYap = async function(i){
    let snap = await getDoc(mesajRef);
    let liste = snap.data().liste;
    liste[i].okundu = true;
    await setDoc(mesajRef,{liste});
}

window.silMesaj = async function(i){
    let snap = await getDoc(mesajRef);
    let liste = snap.data().liste;
    liste.splice(i,1);
    await setDoc(mesajRef,{liste});
}

window.tumunuSil = async function(){
    if(confirm("Tüm mesajlar silinecek?")) await setDoc(mesajRef,{liste:[]});
}

window.okunanlariSil = async function(){
    let snap = await getDoc(mesajRef);
    let liste = snap.data().liste.filter(x=>!x.okundu);
    await setDoc(mesajRef,{liste});
}
</script>
</body>
</html>
