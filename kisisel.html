<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kişisel Panel</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin: 0;
    background: #0f172a;
    font-family: "Segoe UI";
    display: flex;
    justify-content: center;
}

.container {
    width: 360px;
    min-height: 100vh;
    background: #020617;
    border-radius: 25px;
    padding: 15px;
    color: white;
}

/* üst bar */
.topbar {
    display: flex;
    justify-content: space-between;
}

/* mesaj */
.alert {
    background: red;
    padding: 6px 12px;
    border-radius: 10px;
    animation: blink 1s infinite;
}

@keyframes blink {
    0%{opacity:1;}50%{opacity:0.3;}100%{opacity:1;}
}

input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 10px;
    border: none;
}

/* kart */
.kart {
    background: #1e293b;
    padding: 20px;
    border-radius: 20px;
    margin-top: 10px;
}

.kart p {
    display: flex;
    justify-content: space-between;
}

.high { color: #22c55e; }
.low { color: #ef4444; }
</style>
</head>

<body>

<div class="container">

<div class="topbar">
    <h3>⚡ Panel</h3>
    <div id="alertBox" class="alert" style="display:none;">Yeni Mesaj</div>
</div>

<!-- SADECE İLK SEFER -->
<div id="setup"></div>

<div id="kart"></div>
<canvas id="grafik"></canvas>

</div>

<script>

// örnek veri (istersen sheet bağlarız)
const data = [
    { isim:"ahmet", departman:"Kasa", sicil:123, fis:50, satirSayisi:200, fisBasiSure:2, kpuan:80 },
    { isim:"mehmet", departman:"Reyon", sicil:124, fis:30, satirSayisi:120, fisBasiSure:3, kpuan:60 }
];

// mesaj efekti
setInterval(()=>{
    const box = document.getElementById("alertBox");
    box.style.display="block";
    setTimeout(()=>box.style.display="none",3000);
},15000);

// ilk kurulum
function init(){
    const savedUser = localStorage.getItem("user");

    if(!savedUser){
        document.getElementById("setup").innerHTML = `
        <input id="nameInput" placeholder="İsmini bir kez yaz">
        <button onclick="saveUser()">Kaydet</button>`;
    } else {
        render(savedUser);
    }
}

// kaydet
function saveUser(){
    const name = document.getElementById("nameInput").value.toLowerCase();
    localStorage.setItem("user", name);
    location.reload();
}

// render
function render(name){
    const kisi = data.find(x=>x.isim.toLowerCase()===name);
    if(!kisi) return;

    const avg = data.reduce((a,b)=>a+b.kpuan,0)/data.length;

    document.getElementById("kart").innerHTML = `
    <div class="kart">
        <h3>${kisi.isim}</h3>

        <p>🏢 Departman <b>${kisi.departman}</b></p>
        <p>🆔 Sicil <b>${kisi.sicil}</b></p>
        <p>🧾 Fiş Sayısı <b>${kisi.fis}</b></p>
        <p>📊 Satır Sayısı <b>${kisi.satirSayisi}</b></p>
        <p>⏱️ Süre <b>${kisi.fisBasiSure}</b></p>
        <p>⭐ Kpuan <b class="${kisi.kpuan>=avg?'high':'low'}">${kisi.kpuan}</b></p>
    </div>`;

    drawChart(kisi, avg);
}

// grafik
function drawChart(kisi, avg){
    new Chart(document.getElementById("grafik"), {
        type:"doughnut",
        data:{
            labels:["Sen","Ortalama"],
            datasets:[{
                data:[kisi.kpuan, avg]
            }]
        }
    });
}

init();

</script>

</body>
</html>
