<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Kişisel Panel - Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --bg: #0b0f1a; --card: rgba(22, 30, 49, 0.85); --accent: #3b82f6; 
            --text: #ffffff; --border: rgba(255, 255, 255, 0.1);
            --danger: #ef4444; --success: #10b981; --warning: #f59e0b;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg) no-repeat center center fixed; 
            background-size: cover; 
            color: var(--text); 
            min-height: 100vh; 
        }

        body::before { 
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.6); z-index: -1; 
        }

        .appbar { 
            position: fixed; top: 0; width: 100%; height: 50px; 
            background: rgba(11, 15, 26, 0.9); backdrop-filter: blur(20px); 
            display: flex; justify-content: center; align-items: center; 
            font-weight: 800; z-index: 1000; border-bottom: 1px solid var(--border); 
            color: var(--accent); font-size: 14px; 
        }

        .container { width: 100%; max-width: 500px; margin: 0 auto; padding: 70px 15px 120px 15px; }

        /* Giriş Formu */
        .panel-input { 
            width: 100%; padding: 14px; margin: 10px 0; 
            background: rgba(0,0,0,0.3); border: 1px solid var(--border); 
            color: white; border-radius: 12px; font-size: 14px; font-family: inherit;
        }

        /* Kartlar */
        .kart { 
            background: var(--card); padding: 20px; border-radius: 20px; 
            margin-top: 15px; border: 1px solid var(--border); 
            backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .kart h3 { color: var(--accent); font-size: 18px; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .kart p { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; font-weight: 500; color: #cbd5e1; }
        .kart p b { color: white; }

        .high { color: var(--success) !important; }
        .low { color: var(--danger) !important; }

        /* Butonlar */
        .btn { 
            width: 100%; padding: 12px; border-radius: 12px; border: none; 
            font-weight: 800; color: white; font-size: 12px; cursor: pointer; 
            text-transform: uppercase; margin-top: 5px;
        }
        .btn-green { background: var(--success); }
        .btn-blue { background: var(--accent); }
        .btn-outline { background: rgba(255,255,255,0.05); border: 1px solid var(--border); }

        /* Mesajlar */
        .mesaj-baslik { font-size: 16px; font-weight: 800; margin: 25px 0 10px 0; color: var(--warning); display: flex; align-items: center; justify-content: space-between; }
        #sayac { background: var(--danger); padding: 2px 8px; border-radius: 20px; font-size: 10px; color: white; display: none; }
        .alertBlink { animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .yeniMesaj { border-left: 4px solid var(--danger) !important; }

        /* Alt Menü */
        .tabbar { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: rgba(22, 30, 49, 0.95); backdrop-filter: blur(20px); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border); border-radius: 20px 20px 0 0; z-index: 1000; }
        .tab-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; opacity: 0.6; }
        .tab-btn.active { opacity: 1; color: var(--accent); }

        canvas { margin-top: 15px; max-height: 200px; }
    </style>
</head>
<body>

<div class="appbar">⚡ PANELİM</div>

<div class="container">
    <div id="setup"></div>
    <div id="kart"></div>
    
    <div class="kart" id="grafikKarti" style="display:none;">
        <h3>📊 Performans</h3>
        <canvas id="grafik"></canvas>
    </div>

    <div id="mesajBolumu" style="display:none;">
        <div class="mesaj-baslik">
            <span>📩 MESAJLAR</span>
            <span id="sayac" class="alertBlink">0</span>
        </div>
        <div style="display:flex; gap:8px; margin-bottom:15px;">
            <button class="btn btn-outline" style="margin:0" onclick="tumunuSil()">🧹 TEMİZLE</button>
            <button class="btn btn-outline" style="margin:0" onclick="okunanlariSil()">✔ OKUNANLAR</button>
        </div>
        <div id="mesajAlani"></div>
    </div>
</div>

<div class="tabbar">
    <button class="tab-btn" onclick="location.href='index.html'">🏠</button>
    <button class="tab-btn" onclick="location.href='mola.html'">☕</button>
    <button class="tab-btn active">👤</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "ukasa1.firebaseapp.com",
  projectId: "ukasa1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let kullanici = (localStorage.getItem("kullanici") || "").toLowerCase().trim();
const URL = "https://script.google.com/macros/s/AKfycbxODlNf0yl2oAtkd5oMw1ghWavKSOO8TmT81uAUN8Oiqbj8yzx81x7iRexwcAHo7ecv4g/exec";

let tumData = [];
const mesajRef = kullanici ? doc(db, "mesajlar", kullanici) : null;

init();

function init(){
    if(!kullanici){
        document.getElementById("setup").innerHTML = `
            <div class="kart">
                <h3>Giriş</h3>
                <p style="justify-content:center;">Lütfen isminizi girin.</p>
                <input id="nameInput" class="panel-input" placeholder="Örn: Ahmet Yılmaz">
                <button class="btn btn-blue" onclick="saveUser()">GİRİŞ YAP</button>
            </div>`;
    } else {
        document.getElementById("mesajBolumu").style.display = "block";
        veriCek();
        mesajlariDinle();
    }
}

window.saveUser = function(){
    let val = document.getElementById("nameInput").value.toLowerCase().trim();
    if(!val) return alert("İsim gerekli!");
    localStorage.setItem("kullanici", val);
    location.reload();
}

async function veriCek(){
    try {
        const response = await fetch(URL);
        const data = await response.json();
        // Boş satırları filtrele ve global değişkene ata
        tumData = data.filter(x => x.isim && x.isim.trim() !== "");
        render();
    } catch (e) {
        console.error("Veri çekme hatası:", e);
    }
}

function render(){
    // Giriş yapan kişiyi bul
    let kisi = tumData.find(x => x.isim.toLowerCase().trim() === kullanici);
    
    if(!kisi){
        document.getElementById("kart").innerHTML = `
            <div class="kart" style="text-align:center;">
                <p style="justify-content:center;">Veri bulunamadı ❌</p>
                <p style="justify-content:center; font-size:11px;">"${kullanici}" ismi listede yok.</p>
                <button class="btn btn-outline" onclick="localStorage.clear();location.reload();">İSİM DEĞİŞTİR</button>
            </div>`;
        return;
    }

    // Ortalama hesapla
    let avg = tumData.reduce((a,b)=>a+Number(b.kpuan||0),0) / tumData.length;

    // Tüm veri alanlarını (Sheet'teki gibi) ekrana bas
    document.getElementById("kart").innerHTML = `
    <div class="kart">
        <h3>${kisi.isim.toUpperCase()}</h3>
        <p>🏢 Ay: <b>${kisi.ay1 || "-"}</b></p>
        <p>🆔 Sicil: <b>${kisi.sicil || "-"}</b></p>
        <p>🧾 Fiş Sayısı: <b>${kisi.fis1 || "-"}</b></p>
        <p>📊 Satır Sayısı: <b>${kisi.satirSayisi || "-"}</b></p>
        <p>⏱️ Fiş Başı Süre: <b>${kisi.fisBasiSure || "-"}</b></p>
        <p>⭐ Kartezyen Puan: <b class="${Number(kisi.kpuan)>=avg?'high':'low'}">${kisi.kpuan || "-"}</b></p>
        <p>📅 Ay (Bonus): <b>${kisi.ay || "-"}</b></p>
        <p>💰 TL Hakediş: <b>${kisi.tl || "-"}</b></p>
        <p>🤑 Euro Hakediş: <b>${kisi.euro || "-"}</b></p>
        <p>🔢 Toplam Adet: <b>${kisi.adet || "-"}</b></p>
    </div>`;

    document.getElementById("grafikKarti").style.display = "block";
    drawChart(kisi, avg);
}

function drawChart(kisi, avg){
    const ctx = document.getElementById("grafik").getContext('2d');
    new Chart(ctx, {
        type:"doughnut",
        data:{
            labels:["Sen","Ortalama"],
            datasets:[{
                data:[Number(kisi.kpuan || 0), avg],
                backgroundColor: ['#3b82f6', 'rgba(255,255,255,0.05)'],
                borderColor: 'rgba(255,255,255,0.1)',
                borderWidth: 1
            }]
        },
        options: {
            plugins: { legend: { labels: { color: 'white', font: { family: 'Plus Jakarta Sans'} } } }
        }
    });
}

function mesajlariDinle(){
    if(!mesajRef) return;
    onSnapshot(mesajRef, (snap)=>{
        if(!snap.exists()) return;
        let data = snap.data().liste || [];
        let div = document.getElementById("mesajAlani");
        let sayac = document.getElementById("sayac");
        div.innerHTML = "";
        let okunmamis = 0;

        data.slice().reverse().forEach((m, index)=>{
            let realIndex = data.length - 1 - index;
            if(!m.okundu) okunmamis++;

            let d = document.createElement("div");
            d.className = "kart " + (!m.okundu ? "yeniMesaj" : "");
            d.innerHTML = `
                <p style="justify-content:flex-start;">${m.text}</p>
                <small style="font-size:10px;opacity:0.5;">🕒 ${new Date(m.tarih).toLocaleString()}</small>
                <div style="display:flex; gap:5px; margin-top:10px;">
                    ${!m.okundu ? `<button class="btn btn-green" style="padding:6px; font-size:10px;" onclick="okunduYap(${realIndex})">OKUNDU</button>` : ""}
                    <button class="btn btn-outline" style="padding:6px; font-size:10px;" onclick="silMesaj(${realIndex})">SİL</button>
                </div>
            `;
            div.appendChild(d);
        });

        if(okunmamis > 0){
            sayac.innerText = okunmamis;
            sayac.style.display = "inline";
        } else {
            sayac.style.display = "none";
        }
    });
}

window.okunduYap = async function(i){
    let snap = await getDoc(mesajRef);
    let liste = snap.data().liste;
    liste[i].okundu = true;
    await setDoc(mesajRef,{liste});
}

window.silMesaj = async function(i){
    let snap = await getDoc(mesajRef);
    let liste = snap.data().liste;
    liste.splice(i,1);
    await setDoc(mesajRef,{liste});
}

window.tumunuSil = async function(){
    if(confirm("Tüm mesajlar silinsin mi?")) {
        await setDoc(mesajRef,{liste:[]});
    }
}

window.okunanlariSil = async function(){
    let snap = await getDoc(mesajRef);
    let liste = snap.data().liste.filter(x=>!x.okundu);
    await setDoc(mesajRef,{liste});
}
</script>
</body>
</html>
