<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personel Paneli</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { margin:0; background:#020617; font-family:"Segoe UI", sans-serif; color:white; display:flex; justify-content:center; }
        .phone { width:100%; max-width:400px; height:100vh; background:#020617; padding:20px; box-sizing:border-box; }
        .kart { background:#1e293b; padding:20px; border-radius:20px; margin-top:20px; border:1px solid rgba(255,255,255,0.1); }
        .kart h3 { margin:0 0 15px 0; color:#3b82f6; border-bottom:1px solid #334155; padding-bottom:10px; text-transform:uppercase; font-size:16px; }
        .kart p { display:flex; justify-content:space-between; margin:8px 0; font-size:14px; color:#94a3b8; }
        .kart p b { color:white; }
        .high { color:#22c55e; }
        .low { color:#ef4444; }
        button { width:100%; padding:12px; border-radius:12px; border:none; background:#ef4444; color:white; font-weight:bold; cursor:pointer; margin-top:20px; }
        #loader { text-align:center; margin-top:50px; color:#3b82f6; }
    </style>
</head>
<body>

<div class="phone">
    <div id="loader">Verileriniz getiriliyor...</div>
    <div id="icerik" style="display:none;">
        <div id="veriKarti"></div>
        <canvas id="grafik" style="margin-top:20px;"></canvas>
        <button onclick="cikisYap()">🚪 Oturumu Kapat</button>
    </div>
</div>

<script type="module">
const URL = "https://script.google.com/macros/s/AKfycbxODlNf0yl2oAtkd5oMw1ghWavKSOO8TmT81uAUN8Oiqbj8yzx81x7iRexwcAHo7ecv4g/exec";

// index.html'deki 'kullanici' verisini oku
let kullanici = (localStorage.getItem("kullanici") || "").toLowerCase().trim();

if (!kullanici) {
    // Eğer giriş yapılmamışsa ana sayfaya at
    window.location.href = "index.html";
} else {
    veriGetir();
}

async function veriGetir() {
    try {
        const res = await fetch(URL);
        const data = await res.json();
        
        // İsmi veri tabanında bul
        const kisi = data.find(x => x.isim && x.isim.toString().toLowerCase().trim() === kullanici);

        document.getElementById("loader").style.display = "none";
        document.getElementById("icerik").style.display = "block";

        if (!kisi) {
            document.getElementById("veriKarti").innerHTML = `
                <div class="kart" style="text-align:center;">
                    <h3 style="color:#ef4444;">Veri Bulunamadı</h3>
                    <p style="justify-content:center;">"${kullanici}" ismine ait performans kaydı yok.</p>
                </div>`;
            return;
        }

        // Ortalama puan (KPI)
        let avg = data.reduce((a, b) => a + Number(b.kpuan || 0), 0) / data.length;

        document.getElementById("veriKarti").innerHTML = `
            <div class="kart">
                <h3>👤 ${kisi.isim}</h3>
                <p>🏢 Ay: <b>${kisi.ay1 || "-"}</b></p>
                <p>🆔 Sicil: <b>${kisi.sicil || "-"}</b></p>
                <p>🧾 Fiş Sayısı: <b>${kisi.fis1 || "-"}</b></p>
                <p>📊 Satır Sayısı: <b>${kisi.satirSayisi || "-"}</b></p>
                <p>⏱️ Fiş Başı Süre: <b>${kisi.fisBasiSure || "-"}</b></p>
                <p>⭐ Kartezyen Puan: <b class="${kisi.kpuan>=avg?'high':'low'}">${kisi.kpuan || "-"}</b></p>
                <p>🏢 Ay: <b>${kisi.ay || "-"}</b></p>
                <p>🧾 Fiş Sayısı: <b>${kisi.fis || "-"}</b></p>
                <p>💰 TL Hakediş: <b>${kisi.tl || "-"}</b></p>
                <p>🤑 Euro Hakediş: <b>${kisi.euro || "-"}</b></p>
                <p>🔢 Toplam Adet: <b>${kisi.adet || "-"}</b></p>
   
            </div>`;

        new Chart(document.getElementById("grafik"), {
            type: 'doughnut',
            data: {
                labels: ['Puanım', 'Ortalama'],
                datasets: [{
                    data: [Number(kisi.kpuan), avg],
                    backgroundColor: ['#3b82f6', 'rgba(255,255,255,0.05)'],
                    borderWidth: 0
                }]
            },
            options: { cutout: '80%', plugins: { legend: { labels: { color: 'white' } } } }
        });

    } catch (error) {
        document.getElementById("loader").innerText = "Bağlantı Hatası!";
    }
}

window.cikisYap = function() {
    localStorage.removeItem("kullanici");
    window.location.href = "index.html";
}
</script>
</body>
</html>
