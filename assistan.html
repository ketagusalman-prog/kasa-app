<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Umut Salman Asistan & Yönetim</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --accent: #10b981; --text: #f8fafc; --ai-msg: #1e293b; --user-msg: #059669; --border: rgba(255, 255, 255, 0.08); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        #newsTicker { background: #059669; color: white; height: 35px; line-height: 35px; overflow: hidden; position: relative; width: 100%; flex-shrink: 0; z-index: 10; }
        #tickerContent { display: inline-block; white-space: nowrap; position: absolute; font-size: 13px; font-weight: 800; animation: tickerScroll 25s linear infinite; }
        @keyframes tickerScroll { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
        #chatBox { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
        .msg { max-width: 90%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.5; animation: fadeIn 0.3s ease; word-wrap: break-word; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .ai { align-self: flex-start; background: var(--ai-msg); border: 1px solid var(--border); }
        .user { align-self: flex-end; background: var(--user-msg); color: white; }
        #leaveModal, #contactModal, #adminPanel, #feedbackModal, #remindModal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.98); z-index: 5000; display: none; flex-direction: column; padding: 20px; overflow-y: auto; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 25px; width: 100%; max-width: 400px; border: 1px solid var(--border); margin: auto; }
        .panel-sec { background: #1e293b; padding: 15px; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 15px; }
        textarea, select { width: 100%; background: #0f172a; color: white; border: 1px solid var(--border); border-radius: 10px; padding: 10px; font-size: 13px; margin-top: 10px; outline: none; }
        #loginOverlay { position: fixed; inset: 0; background: var(--bg); z-index: 9000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #1e293b; padding: 35px; border-radius: 30px; text-align: center; width: 340px; border: 1px solid var(--border); }
        input { width: 100%; background: #1e293b; border: 1px solid var(--border); padding: 12px 20px; border-radius: 25px; color: white; margin-bottom: 10px; outline: none; }
        .input-container { position: relative; width: 100%; padding: 15px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); display: flex; gap: 8px; border-top: 1px solid var(--border); flex-shrink: 0; }
        .btn { padding: 12px 20px; border-radius: 25px; cursor: pointer; border: none; font-weight: 700; transition: 0.2s; display: inline-block; text-align: center; }
        .btn-accent { background: var(--accent); color: white; }
        
        .request-item { background: #0f172a; padding: 15px; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 10px; }
        .request-btns { display: flex; gap: 10px; margin-top: 10px; }
        .btn-ok { background: #059669; color: white; flex: 1; padding: 8px; border-radius: 10px; font-size: 12px; }
        .btn-no { background: #ef4444; color: white; flex: 1; padding: 8px; border-radius: 10px; font-size: 12px; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h2 style="color:var(--accent); margin-bottom:20px;">Sistem Girişi</h2>
        <input type="text" id="kullanici" placeholder="Kullanıcı Adı">
        <input type="password" id="sifre" placeholder="Şifre">
        <button id="loginBtn" class="btn btn-accent" style="width:100%;">GİRİŞ</button>
        <p id="loginError" style="color:#ef4444; font-size:12px; margin-top:15px; display:none;">Giriş başarısız!</p>
    </div>
</div>

<div id="remindModal"><div class="modal-content"><h3>⏰ Hatırlatıcı Kur</h3><input type="date" id="remindDate" style="margin-top:15px"><textarea id="remindText" placeholder="Notunuz..."></textarea><button class="btn btn-accent" style="width:100%; margin-top:10px;" id="saveRemindBtn">KAYDET</button><button class="btn" onclick="document.getElementById('remindModal').style.display='none'">İPTAL</button></div></div>
<div id="feedbackModal"><div class="modal-content"><h3>📝 Geri Bildirim</h3><input type="date" id="fbDate" style="margin-top:15px"><select id="fbUserList"></select><select id="fbType"><option value="Olumlu">Pozitif</option><option value="Olumsuz">Uyarı</option></select><textarea id="fbText"></textarea><button class="btn btn-accent" style="width:100%;" id="saveFbBtn">KAYDET</button><button class="btn" onclick="document.getElementById('feedbackModal').style.display='none'">İPTAL</button></div></div>
<div id="leaveModal"><div class="modal-content"><h3>📅 İzin Talebi</h3><input type="date" id="leaveStart" style="margin-top:10px"><input type="date" id="leaveEnd"><button class="btn btn-accent" style="width:100%;" id="submitLeaveBtn">GÖNDER</button><button class="btn" onclick="document.getElementById('leaveModal').style.display='none'">KAPAT</button></div></div>
<div id="contactModal"><div class="modal-content"><h3>✉️ Not Bırak</h3><textarea id="contactMsg"></textarea><button class="btn btn-accent" style="width:100%;" id="submitContactBtn">İLET</button><button class="btn" onclick="document.getElementById('contactModal').style.display='none'">İPTAL</button></div></div>

<div class="appbar" style="height:60px; padding:0 15px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); background: #1e293b;">
    <span id="welcomeText" style="font-weight:800; color:var(--accent);">ASİSTAN</span>
    <div style="display:flex; gap:5px;">
        <button class="btn" onclick="document.getElementById('remindModal').style.display='flex'">⏰</button>
        <button class="btn" onclick="document.getElementById('contactModal').style.display='flex'">✉️</button>
        <button class="btn" onclick="document.getElementById('leaveModal').style.display='flex'">📅</button>
        <button class="btn" id="adminGear" style="background:transparent; color:#64748b; display:none;">⚙️</button>
    </div>
</div>

<div id="newsTicker"><div id="tickerContent">Yükleniyor...</div></div>

<div id="adminPanel">
    <h2 style="margin-bottom:20px; color:var(--accent)">⚙️ Yönetim</h2>
    <div class="panel-sec">
        <h3>📥 Bekleyen Talepler</h3>
        <div id="talepListesi" style="margin-top:10px;"></div>
    </div>
    <div class="panel-sec"><h3>👤 Kullanıcılar</h3><textarea id="data_users"></textarea></div>
    <div class="panel-sec"><h3>📜 Kurallar</h3><textarea id="data_kurallar"></textarea></div>
    <div class="panel-sec"><h3>🛒 Kasaönü</h3><textarea id="data_kasaonu"></textarea></div>
    <div class="panel-sec"><h3>💬 Geri Bildirimler</h3><textarea id="data_feedback"></textarea></div>
    <div class="panel-sec"><h3>✅ Onaylı İzinler</h3><textarea id="data_izin"></textarea></div>
    <div class="panel-sec"><h3>📢 Duyurular</h3><textarea id="data_magaza"></textarea></div>
    <div style="display:flex; gap:10px; padding-bottom:20px;"><button class="btn btn-accent" style="flex:1;" id="savePanelsBtn">💾 TÜMÜNÜ KAYDET</button><button class="btn" id="closeAdminBtn">KAPAT</button></div>
</div>

<div id="chatBox"></div>
<div class="input-container"><input type="text" id="userInput" placeholder="Sorunuzu yazın..."><button class="btn btn-accent" id="sendBtn">GÖNDER</button></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyChKcwZnw1fe_SFWy2dJA_JZOMiKghF5_o", authDomain: "ukasa1.firebaseapp.com", projectId: "ukasa1", appId: "1:929741424159:web:733f958e2fe7c13984f72a" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentUserKadi = ""; let realName = ""; let isAdmin = false;
let dbData = { izin: "", magaza: "", kasaonu: "", users: "", kurallar: "", feedback: "" };
let personeller = [];
let chatHistory = []; 

onSnapshot(doc(db, "kasa", "personel"), snap => { if (snap.exists()) personeller = snap.data().liste || []; });
onSnapshot(doc(db, "kasa", "bilgiBankasi"), snap => {
    if (snap.exists()) {
        dbData = snap.data();
        document.getElementById("data_izin").value = dbData.izin || "";
        document.getElementById("data_magaza").value = dbData.magaza || "";
        document.getElementById("data_kasaonu").value = dbData.kasaonu || "";
        document.getElementById("data_users").value = dbData.users || "";
        document.getElementById("data_kurallar").value = dbData.kurallar || "";
        document.getElementById("data_feedback").value = dbData.feedback || "";
        const haberler = (dbData.magaza || "").split('\n').filter(l => l.trim().startsWith("-")).map(l => l.trim().substring(1).trim());
        document.getElementById("tickerContent").innerText = haberler.join("    •    ") || "Duyuru yok.";
        updatePersonelSelect();
    }
});

// Gelişmiş Çakışma Kontrolü (Client-Side)
function isConflict(startStr, endStr, userName) {
    const start = new Date(startStr).getTime();
    const end = new Date(endStr).getTime();
    const izinSatirlari = (dbData.izin || "").split('\n');
    
    for (let satir of izinSatirlari) {
        if (satir.toUpperCase().includes(userName.toUpperCase())) {
            const parts = satir.split(':');
            if (parts.length >= 3) {
                const dates = parts[2].split('/');
                const exStart = new Date(dates[0].trim()).getTime();
                const exEnd = new Date(dates[1].trim()).getTime();
                
                // Karşılıklı çakışma mantığı
                if ((start <= exEnd && start >= exStart) || (end <= exEnd && end >= exStart) || (start <= exStart && end >= exEnd)) {
                    return true;
                }
            }
        }
    }
    return false;
}

onSnapshot(doc(db, "kasa", "talepler"), snap => {
    const talepDiv = document.getElementById("talepListesi");
    talepDiv.innerHTML = "";
    if (snap.exists()) {
        const liste = snap.data().liste || [];
        liste.forEach((t, i) => {
            const item = document.createElement("div");
            item.className = "request-item";
            item.innerHTML = `
                <div style="font-size:13px;">${t}</div>
                <div class="request-btns">
                    <button class="btn-ok" id="approve-${i}">ONAYLA</button>
                    <button class="btn-no" id="reject-${i}">REDDET</button>
                </div>
            `;
            talepDiv.appendChild(item);
            document.getElementById(`approve-${i}`).onclick = async () => {
                if(!confirm("Bu talebi onaylayıp 'Onaylı İzinler' listesine taşımak istiyor musunuz?")) return;
                await updateDoc(doc(db, "kasa", "bilgiBankasi"), { izin: (dbData.izin || "") + "\n" + t });
                await updateDoc(doc(db, "kasa", "talepler"), { liste: arrayRemove(t) });
            };
            document.getElementById(`reject-${i}`).onclick = async () => {
                if(confirm("Talebi silmek istediğinize emin misiniz?")) {
                    await updateDoc(doc(db, "kasa", "talepler"), { liste: arrayRemove(t) });
                }
            };
        });
    }
});

document.getElementById("loginBtn").addEventListener("click", () => {
    const k = document.getElementById("kullanici").value.trim().toLowerCase();
    const s = document.getElementById("sifre").value.trim();
    if (k === "admin" && s === "1234") { 
        currentUserKadi = "admin"; realName = "AHMET KANDİŞ"; isAdmin = true; 
    } else {
        const p = personeller.find(x => x.k.toLowerCase() === k && x.s === s);
        if (p) { 
            currentUserKadi = k; isAdmin = false;
            const match = (dbData.users || "").split('\n').find(l => l.toLowerCase().startsWith(k + ":"));
            realName = match ? match.split(':')[1].trim() : k;
        }
    }
    if (currentUserKadi) {
        document.getElementById("loginOverlay").style.display = "none";
        document.getElementById("welcomeText").innerText = realName.toUpperCase();
        if (isAdmin) document.getElementById("adminGear").style.display = "block";
        
        let msg = (realName.toUpperCase().includes("AHMET KANDİŞ")) 
            ? `Merhaba AHMET KANDİŞ! Ben Umut Salman'ın kişisel dijital asistanıyım. Size nasıl yardımcı olabilirim?`
            : `Merhaba ${realName}! Ben Umut Salman'ın kişisel dijital asistanıyım. Size nasıl yardımcı olabilirim?`;
        appendMsg(msg, "ai");
    } else { document.getElementById("loginError").style.display = "block"; }
});

document.getElementById("submitLeaveBtn").onclick = async () => {
    const s = document.getElementById("leaveStart").value;
    const e = document.getElementById("leaveEnd").value;
    if (!s || !e) { alert("Lütfen tarihleri seçin."); return; }
    
    // PERSONEL GÖNDERMEDEN ÖNCE ÇAKIŞMA KONTROLÜ
    if (isConflict(s, e, realName)) {
        alert("Üzgünüm, seçtiğiniz tarihlerde zaten onaylanmış bir izniniz bulunuyor. Lütfen tarihleri kontrol edip tekrar deneyin.");
        return; 
    }

    if(!confirm(`${s} - ${e} tarihleri için izin talebi gönderilsin mi?`)) return;
    await updateDoc(doc(db, "kasa", "talepler"), { liste: arrayUnion(`İZİN: ${realName.toUpperCase()}: ${s} / ${e}`) });
    appendMsg("Umut Salman'ın dijital asistanıyım; talebiniz incelenmek üzere başarıyla iletildi.", "ai"); 
    document.getElementById("leaveModal").style.display = "none";
};

document.getElementById("sendBtn").addEventListener("click", async () => {
    const input = document.getElementById("userInput"); const text = input.value.trim(); if (!text) return;
    let savedKey = localStorage.getItem("groq_api_key");
    if (!savedKey) { savedKey = prompt("Groq API Key?"); if (savedKey) localStorage.setItem("groq_api_key", savedKey.trim()); else return; }
    appendMsg(text, "user"); input.value = "";
    const filterData = (str) => isAdmin ? str : (str || "").split('\n').filter(l => l.toUpperCase().includes(realName.toUpperCase())).join('\n');
    const context = `PANEL: Duyuru:${dbData.magaza}, Kural:${dbData.kurallar}, İzin:${filterData(dbData.izin)}, Kasa:${filterData(dbData.kasaonu)}`;
    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST", headers: { "Authorization": `Bearer ${savedKey}`, "Content-Type": "application/json" },
            body: JSON.stringify({ model: "llama-3.1-8b-instant", messages: [{role:"system", content:`Umut Salman asistanıyım. Kullanıcı: ${realName}. Veriler: ${context}`}, ...chatHistory, {role:"user", content:text}], temperature: 0.1 })
        });
        const data = await response.json(); const aiResp = data.choices[0].message.content;
        chatHistory.push({role:"user", content:text}, {role:"assistant", content:aiResp});
        if(chatHistory.length > 10) chatHistory.splice(0,2);
        appendMsg(aiResp, "ai");
    } catch (e) { appendMsg("Hata oluştu.", "ai"); }
});

function appendMsg(t, s) {
    const b = document.getElementById("chatBox"); const d = document.createElement("div"); 
    d.className = `msg ${s}`; d.innerText = t; b.appendChild(d); b.scrollTop = b.scrollHeight;
}

function updatePersonelSelect() {
    const sel = document.getElementById("fbUserList"); if(!sel) return;
    sel.innerHTML = '<option value="">Seçin</option>';
    (dbData.users || "").split('\n').forEach(u => { if(u.includes(":")) { const name = u.split(":")[1].trim(); sel.innerHTML += `<option value="${name.toUpperCase()}">${name}</option>`; } });
}

document.getElementById("savePanelsBtn").onclick = async () => {
    await updateDoc(doc(db, "kasa", "bilgiBankasi"), { 
        izin: document.getElementById("data_izin").value, magaza: document.getElementById("data_magaza").value, 
        kasaonu: document.getElementById("data_kasaonu").value, users: document.getElementById("data_users").value,
        kurallar: document.getElementById("data_kurallar").value, feedback: document.getElementById("data_feedback").value
    });
    alert("Ayarlar Başarıyla Kaydedildi!"); 
};

document.getElementById("adminGear").onclick = () => document.getElementById("adminPanel").style.display = "flex";
document.getElementById("closeAdminBtn").onclick = () => document.getElementById("adminPanel").style.display = "none";

document.getElementById("submitContactBtn").onclick = async () => {
    const m = document.getElementById("contactMsg").value;
    await updateDoc(doc(db, "kasa", "talepler"), { liste: arrayUnion(`NOT: ${realName.toUpperCase()}: ${m}`) });
    appendMsg("Umut Salman'ın dijital asistanıyım, notunuz başarıyla iletildi.", "ai"); document.getElementById("contactModal").style.display = "none";
};

document.getElementById("saveFbBtn").onclick = async () => {
    const user = document.getElementById("fbUserList").value;
    const newFb = `\n[${document.getElementById("fbDate").value}] ${user}: ${document.getElementById("fbType").value} - ${document.getElementById("fbText").value}`;
    await updateDoc(doc(db, "kasa", "bilgiBankasi"), { feedback: (dbData.feedback || "") + newFb });
    alert("Geri bildirim kaydedildi."); document.getElementById("feedbackModal").style.display = "none";
};
</script>
</body>
</html>
