<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Umut Salman Asistan & Yönetim</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --accent: #10b981; --text: #f8fafc; --ai-msg: #1e293b; --user-msg: #059669; --border: rgba(255, 255, 255, 0.08); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        #newsTicker { background: #059669; color: white; height: 35px; line-height: 35px; overflow: hidden; position: relative; width: 100%; flex-shrink: 0; z-index: 10; }
        #tickerContent { display: inline-block; white-space: nowrap; position: absolute; font-size: 13px; font-weight: 800; animation: tickerScroll 25s linear infinite; }
        @keyframes tickerScroll { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
        #chatBox { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
        .msg { max-width: 90%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.5; animation: fadeIn 0.3s ease; word-wrap: break-word; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .ai { align-self: flex-start; background: var(--ai-msg); border: 1px solid var(--border); }
        .user { align-self: flex-end; background: var(--user-msg); color: white; }
        #leaveModal, #contactModal, #adminPanel, #feedbackModal, #remindModal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.98); z-index: 5000; display: none; flex-direction: column; padding: 20px; overflow-y: auto; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 25px; width: 100%; max-width: 400px; border: 1px solid var(--border); margin: auto; }
        .panel-sec { background: #1e293b; padding: 15px; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 15px; }
        textarea, select { width: 100%; background: #0f172a; color: white; border: 1px solid var(--border); border-radius: 10px; padding: 10px; font-size: 13px; margin-top: 10px; outline: none; }
        #loginOverlay { position: fixed; inset: 0; background: var(--bg); z-index: 9000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #1e293b; padding: 35px; border-radius: 30px; text-align: center; width: 340px; border: 1px solid var(--border); }
        input { width: 100%; background: #1e293b; border: 1px solid var(--border); padding: 12px 20px; border-radius: 25px; color: white; margin-bottom: 10px; outline: none; }
        .input-container { position: relative; width: 100%; padding: 15px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); display: flex; gap: 8px; border-top: 1px solid var(--border); flex-shrink: 0; }
        .btn { padding: 12px 20px; border-radius: 25px; cursor: pointer; border: none; font-weight: 700; transition: 0.2s; display: inline-block; text-align: center; }
        .btn-accent { background: var(--accent); color: white; }
        .btn-contact { background: #8b5cf6; color: white; font-size: 11px; }
        .btn-remind { background: #f59e0b; color: white; font-size: 11px; }
        .btn-leave { background: #3b82f6; color: white; font-size: 11px; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h2 style="color:var(--accent); margin-bottom:20px;">Sistem Girişi</h2>
        <input type="text" id="kullanici" placeholder="Kullanıcı Adı">
        <input type="password" id="sifre" placeholder="Şifre">
        <button class="btn btn-accent" style="width:100%;" onclick="login()">GİRİŞ</button>
        <p id="loginError" style="color:#ef4444; font-size:12px; margin-top:15px; display:none;">Giriş başarısız!</p>
    </div>
</div>

<div id="remindModal"><div class="modal-content"><h3>⏰ Hatırlatıcı Kur</h3><input type="date" id="remindDate" style="margin-top:15px"><textarea id="remindText" placeholder="Notunuz..."></textarea><button class="btn btn-remind" style="width:100%; margin-top:10px;" onclick="saveReminder()">KAYDET</button><button class="btn" onclick="closeRemind()">İPTAL</button></div></div>
<div id="feedbackModal"><div class="modal-content"><h3>📝 Geri Bildirim</h3><input type="date" id="fbDate" style="margin-top:15px"><select id="fbUserList"></select><select id="fbType"><option value="Olumlu">Pozitif</option><option value="Olumsuz">Uyarı</option></select><textarea id="fbText"></textarea><button class="btn btn-accent" style="width:100%;" onclick="saveFeedback()">KAYDET</button><button class="btn" onclick="closeFeedback()">İPTAL</button></div></div>
<div id="leaveModal"><div class="modal-content"><h3>📅 İzin Talebi</h3><input type="date" id="leaveStart" style="margin-top:10px"><input type="date" id="leaveEnd"><button class="btn btn-accent" style="width:100%;" onclick="submitLeave()">GÖNDER</button><button class="btn" onclick="closeLeave()">KAPAT</button></div></div>
<div id="contactModal"><div class="modal-content"><h3>✉️ Not Bırak</h3><textarea id="contactMsg"></textarea><button class="btn" style="width:100%; background:#8b5cf6; color:white;" onclick="submitContact()">İLET</button><button class="btn" onclick="closeContact()">İPTAL</button></div></div>

<div class="appbar" style="height:60px; padding:0 15px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); background: #1e293b;">
    <span id="welcomeText" style="font-weight:800; color:var(--accent);">ASİSTAN</span>
    <div style="display:flex; gap:5px;">
        <button class="btn btn-remind" onclick="openRemind()">⏰</button>
        <button class="btn btn-contact" onclick="openContact()">✉️ NOT</button>
        <button class="btn btn-leave" onclick="openLeave()">📅 İZİN</button>
        <button class="btn" id="adminGear" style="background:transparent; color:#64748b; display:none; font-size:18px;" onclick="toggleAdmin()">⚙️</button>
    </div>
</div>

<div id="newsTicker"><div id="tickerContent">Yükleniyor...</div></div>

<div id="adminPanel">
    <h2 style="margin-bottom:20px; color:var(--accent)">⚙️ Panel</h2>
    <div class="panel-sec"><button class="btn" style="background:#f59e0b; color:white; width:100%;" onclick="openFeedback()">📣 GERİ BİLDİRİM</button></div>
    <div class="panel-sec"><h3>👤 Kullanıcılar</h3><textarea id="data_users"></textarea></div>
    <div class="panel-sec"><h3>📜 Kurallar</h3><textarea id="data_kurallar"></textarea></div>
    <div class="panel-sec"><h3>🛒 Kasaönü</h3><textarea id="data_kasaonu"></textarea></div>
    <div class="panel-sec"><h3>📩 Talepler</h3><div id="requestContainer"></div></div>
    <div class="panel-sec"><h3>📂 Arşiv</h3><textarea id="data_notlar" readonly></textarea></div>
    <div class="panel-sec"><h3>💬 Geri Bildirimler</h3><textarea id="data_feedback"></textarea></div>
    <div class="panel-sec"><h3>✅ İzinler</h3><textarea id="data_izin"></textarea></div>
    <div class="panel-sec"><h3>📢 Duyurular</h3><textarea id="data_magaza"></textarea></div>
    <div style="display:flex; gap:10px;"><button class="btn btn-accent" style="flex:1;" onclick="saveAllPanels()">💾 KAYDET</button><button class="btn" onclick="toggleAdmin()">KAPAT</button></div>
</div>

<div id="chatBox"></div>
<div class="input-container"><input type="text" id="userInput" placeholder="Sorunuzu buraya yazın..."><button class="btn btn-accent" onclick="send()">GÖNDER</button></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc, updateDoc, arrayUnion, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyChKcwZnw1fe_SFWy2dJA_JZOMiKghF5_o", authDomain: "ukasa1.firebaseapp.com", projectId: "ukasa1", appId: "1:929741424159:web:733f958e2fe7c13984f72a" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentUserKadi = ""; let realName = ""; let isAdmin = false;
let dbData = { izin: "", magaza: "", kasaonu: "", users: "", kurallar: "", notlar: "", feedback: "", reminders: [] };
let personeller = [];
let reminderCounter = 0;

onSnapshot(doc(db, "kasa", "personel"), snap => { if (snap.exists()) personeller = snap.data().liste || []; });
onSnapshot(doc(db, "kasa", "bilgiBankasi"), snap => {
    if (snap.exists()) {
        dbData = { ...dbData, ...snap.data() };
        document.getElementById("data_izin").value = dbData.izin || "";
        document.getElementById("data_magaza").value = dbData.magaza || "";
        document.getElementById("data_kasaonu").value = dbData.kasaonu || "";
        document.getElementById("data_users").value = dbData.users || "";
        document.getElementById("data_kurallar").value = dbData.kurallar || "";
        document.getElementById("data_notlar").value = dbData.notlar || "";
        document.getElementById("data_feedback").value = dbData.feedback || "";
        const haberler = (dbData.magaza || "").split('\n').filter(l => l.trim().startsWith("-")).map(l => l.trim().substring(1).trim());
        document.getElementById("tickerContent").innerText = haberler.join("    •    ") || "Duyuru yok.";
        updatePersonelSelect();
    }
});

onSnapshot(doc(db, "kasa", "talepler"), snap => {
    const cont = document.getElementById("requestContainer"); cont.innerHTML = "";
    if (snap.exists() && snap.data().liste) {
        snap.data().liste.forEach((t, i) => {
            const d = document.createElement("div"); d.style="display:flex; justify-content:space-between; background:#0f172a; padding:8px; border-radius:8px; margin-bottom:5px; border:1px solid var(--border);";
            d.innerHTML = `<span style="font-size:11px">${t}</span><button class="btn" style="background:#10b981; padding:3px 8px; font-size:10px" onclick="approveRequest('${t}', ${i})">ONAYLA</button>`;
            cont.appendChild(d);
        });
    }
});

function updatePersonelSelect() {
    const sel = document.getElementById("fbUserList"); if(!sel) return;
    const users = (dbData.users || "").split('\n');
    sel.innerHTML = '<option value="">Personel Seçin</option>';
    users.forEach(u => { if(u.includes(":")) { const name = u.split(":")[1].trim(); sel.innerHTML += `<option value="${name.toUpperCase()}">${name}</option>`; } });
}

window.login = () => {
    const k = document.getElementById("kullanici").value.trim().toLowerCase();
    const s = document.getElementById("sifre").value.trim();
    if (k === "admin" && s === "1234") { currentUserKadi = "admin"; realName = "Umut Salman"; isAdmin = true; }
    else {
        const p = personeller.find(x => x.k.toLowerCase() === k && x.s === s);
        if (p) { 
            currentUserKadi = k; isAdmin = false;
            const match = (dbData.users || "").split('\n').find(l => l.toLowerCase().startsWith(k + ":"));
            realName = match ? match.split(':')[1].trim() : k;
        }
    }
    if (currentUserKadi) {
        document.getElementById("loginOverlay").style.display = "none";
        document.getElementById("welcomeText").innerText = realName.toUpperCase();
        if (isAdmin) document.getElementById("adminGear").style.display = "block";
        appendMsg(`Hoş geldin ${realName.toUpperCase()}, Umut Salman'ın dijital asistanıyım. Sana nasıl yardımcı olabilirim?`, "ai");
        checkReminders();
    } else { document.getElementById("loginError").style.display = "block"; }
};

window.saveReminder = async () => {
    const date = document.getElementById("remindDate").value;
    const text = document.getElementById("remindText").value.trim();
    if(!date || !text) return;
    const newRemind = { id: Date.now(), user: realName.toUpperCase(), date: date, text: text, done: false };
    await setDoc(doc(db, "kasa", "bilgiBankasi"), { ...dbData, reminders: [...(dbData.reminders || []), newRemind] });
    alert("Hatırlatıcı kuruldu!"); closeRemind();
};

window.saveFeedback = async () => {
    const user = document.getElementById("fbUserList").value;
    const date = document.getElementById("fbDate").value;
    const type = document.getElementById("fbType").value;
    const text = document.getElementById("fbText").value.trim();
    if(!user || !date || !text) { alert("Lütfen tüm alanları doldurun!"); return; }
    const entry = `${user} | ${date} | ${type} | ${text}`;
    const newFeedback = dbData.feedback ? dbData.feedback + "\n" + entry : entry;
    await setDoc(doc(db, "kasa", "bilgiBankasi"), { ...dbData, feedback: newFeedback });
    alert("Geri bildirim kaydedildi!"); closeFeedback();
};

function checkReminders() {
    const today = new Date().toISOString().split('T')[0];
    const myReminds = (dbData.reminders || []).filter(r => r.user === realName.toUpperCase() && r.date === today && !r.done);
    if(myReminds.length > 0 && reminderCounter < 1) {
        myReminds.forEach(r => {
            const html = `⏰ <b>HATIRLATMA:</b> ${r.text}<br><button class="btn btn-accent" style="margin-top:8px; font-size:10px" onclick="completeReminder(${r.id})">YAPTIM / KAPAT</button>`;
            appendMsg(html, "ai", true);
        });
        reminderCounter++;
    }
}

window.completeReminder = async (id) => {
    const updated = dbData.reminders.filter(r => r.id !== id);
    await setDoc(doc(db, "kasa", "bilgiBankasi"), { ...dbData, reminders: updated });
    appendMsg("Harika! Hatırlatma başarıyla kapatıldı.", "ai");
};

window.send = async () => {
    const input = document.getElementById("userInput"); const text = input.value.trim(); if (!text) return;
    appendMsg(text, "user"); input.value = "";
    
    const cleanName = realName.toUpperCase().trim();
    let userIzin = (dbData.izin || "").split('\n').filter(l => l.toUpperCase().includes(cleanName)).join('\n');
    let userKasa = (dbData.kasaonu || "").split('\n').filter(l => l.toUpperCase().includes(cleanName)).join('\n');
    let userFeedback = (dbData.feedback || "").split('\n').filter(l => l.toUpperCase().includes(cleanName)).join('\n');

    try {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": "Bearer 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", "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "llama-3.1-8b-instant",
                messages: [{ 
                    role: "system", 
                    content: `Sen Umut Salman'ın akıllı dijital asistanısın. Görevin paneldeki verileri kullanıcıya profesyonelce sunmaktır.
                    
                    KİMLİK BİLGİLERİ:
                    - Sen bir asistansın (Umut Salman değilsin). 
                    - Şuan konuştuğun kişi: ${realName}. Ona ismiyle hitap et.
                    
                    PANEL VERİLERİ (MUTLAK DOĞRU):
                    - Mağaza Duyuruları: ${dbData.magaza}
                    - Seninle (${realName}) ilgili Geri Bildirimler: ${userFeedback || "Kayıt yok."}
                    - Seninle (${realName}) ilgili Kasa Satış Verileri: ${userKasa || "Kayıt yok."}
                    - Seninle (${realName}) ilgili İzin Durumu: ${userIzin || "Kayıt yok."}
                    
                    ÖNEMLİ KURALLAR:
                    1. Asla uydurma veri (2016, 2020 gibi eski tarihler) söyleme. Sadece yukarıdaki listeyi kullan.
                    2. "Fiş adedi" veya "Satış sayısı" sorulduğunda Kasa Satış verisindeki sayısal değeri ver.
                    3. Her zaman motive edici, nazik ve çözüm odaklı ol.
                    4. Eğer veri panelde yoksa 'Panelde buna dair bir bilgi bulamadım Ahmet' şeklinde cevap ver.` 
                }, { role: "user", content: text }],
                temperature: 0
            })
        });
        const data = await res.json(); appendMsg(data.choices[0].message.content, "ai");
        checkReminders();
    } catch (e) { appendMsg("Sistem meşgul, lütfen tekrar deneyin.", "ai"); }
};

window.submitLeave = async () => {
    const s = document.getElementById("leaveStart").value; const e = document.getElementById("leaveEnd").value;
    if (!s || !e) return;
    await updateDoc(doc(db, "kasa", "talepler"), { liste: arrayUnion(`İZİN: ${realName.toUpperCase()}: ${s} / ${e}`) });
    appendMsg(`İzin talebin iletildi ${realName.split(' ')[0]}.`, "ai"); closeLeave();
};

window.submitContact = async () => {
    const m = document.getElementById("contactMsg").value.trim(); if(!m) return;
    await updateDoc(doc(db, "kasa", "talepler"), { liste: arrayUnion(`NOT: ${realName.toUpperCase()}: ${m}`) });
    appendMsg(`Notunu Umut Salman'a iletilmek üzere kaydettim.`, "ai"); closeContact();
};

window.saveAllPanels = async () => {
    await setDoc(doc(db, "kasa", "bilgiBankasi"), { ...dbData,
        izin: document.getElementById("data_izin").value, magaza: document.getElementById("data_magaza").value, 
        kasaonu: document.getElementById("data_kasaonu").value, users: document.getElementById("data_users").value,
        kurallar: document.getElementById("data_kurallar").value, feedback: document.getElementById("data_feedback").value
    });
    alert("Panel verileri güncellendi!"); toggleAdmin();
};

function appendMsg(t, s, html = false) {
    const b = document.getElementById("chatBox"); const d = document.createElement("div"); d.className = `msg ${s}`;
    if(html) d.innerHTML = t; else d.innerText = t;
    b.appendChild(d); b.scrollTop = b.scrollHeight;
}
window.toggleAdmin = () => document.getElementById("adminPanel").style.display = (document.getElementById("adminPanel").style.display === "flex") ? "none" : "flex";
window.openRemind = () => document.getElementById("remindModal").style.display = "flex";
window.closeRemind = () => document.getElementById("remindModal").style.display = "none";
window.openLeave = () => document.getElementById("leaveModal").style.display = "flex";
window.closeLeave = () => document.getElementById("leaveModal").style.display = "none";
window.openContact = () => document.getElementById("contactModal").style.display = "flex";
window.closeContact = () => document.getElementById("contactModal").style.display = "none";
window.openFeedback = () => document.getElementById("feedbackModal").style.display = "flex";
window.closeFeedback = () => document.getElementById("feedbackModal").style.display = "none";
</script>
</body>
</html>
