<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Umut Salman Asistan & Yönetim</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --accent: #10b981; --text: #f8fafc; --ai-msg: #1e293b; --user-msg: #059669; --border: rgba(255, 255, 255, 0.08); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #newsTicker { background: #059669; color: white; height: 35px; line-height: 35px; overflow: hidden; position: relative; width: 100%; z-index: 10; }
        #tickerContent { display: inline-block; white-space: nowrap; position: absolute; font-size: 13px; font-weight: 800; animation: tickerScroll 25s linear infinite; }
        @keyframes tickerScroll { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
        #chatBox { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 80px; }
        .msg { max-width: 90%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.5; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .ai { align-self: flex-start; background: var(--ai-msg); border: 1px solid var(--border); }
        .user { align-self: flex-end; background: var(--user-msg); color: white; }
        #leaveModal, #adminPanel { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.98); z-index: 5000; display: none; flex-direction: column; padding: 20px; overflow-y: auto; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 25px; width: 100%; max-width: 400px; border: 1px solid var(--border); margin: auto; }
        .panel-sec { background: #1e293b; padding: 15px; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 15px; }
        textarea { width: 100%; height: 80px; background: #0f172a; color: white; border: 1px solid var(--border); border-radius: 10px; padding: 10px; font-size: 13px; margin-top: 10px; }
        #loginOverlay { position: fixed; inset: 0; background: var(--bg); z-index: 9000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #1e293b; padding: 35px; border-radius: 30px; text-align: center; width: 340px; border: 1px solid var(--border); }
        input { width: 100%; background: #1e293b; border: 1px solid var(--border); padding: 12px 20px; border-radius: 25px; color: white; margin-bottom: 10px; outline: none; }
        .input-container { position: fixed; bottom: 0; width: 100%; padding: 15px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); display: flex; gap: 8px; border-top: 1px solid var(--border); }
        .btn { padding: 12px 20px; border-radius: 25px; cursor: pointer; border: none; font-weight: 700; transition: 0.2s; }
        .btn-accent { background: var(--accent); color: white; }
        .btn-leave { background: #3b82f6; color: white; font-size: 11px; }
        .shift-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11px; }
        .shift-table th, .shift-table td { border: 1px solid var(--border); padding: 8px; text-align: left; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h2 style="color:var(--accent); margin-bottom:20px;">Sistem Girişi</h2>
        <input type="text" id="kullanici" placeholder="Kullanıcı Adı">
        <input type="password" id="sifre" placeholder="Şifre">
        <button class="btn btn-accent" style="width:100%; margin-top:10px;" onclick="login()">GİRİŞ</button>
        <p id="loginError" style="color:#ef4444; font-size:12px; margin-top:15px; display:none;">Hatalı giriş!</p>
    </div>
</div>

<div id="leaveModal">
    <div class="modal-content">
        <h3 style="color:var(--accent)">📅 İzin Talebi</h3>
        <input type="date" id="leaveStart" style="margin-top:10px">
        <input type="date" id="leaveEnd">
        <button class="btn btn-accent" style="width:100%; margin-top:10px;" onclick="submitLeave()">GÖNDER</button>
        <button class="btn" style="width:100%; background:transparent; color:#64748b; margin-top:10px;" onclick="closeLeave()">KAPAT</button>
    </div>
</div>

<div class="appbar" style="height:60px; padding:0 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); background: #1e293b;">
    <span id="welcomeText" style="font-weight:800; color:var(--accent);">ASİSTAN</span>
    <div style="display:flex; gap:10px;">
        <button class="btn btn-leave" onclick="openLeave()">📅 İZİN</button>
        <button class="btn" id="adminGear" style="background:transparent; color:#64748b; display:none; font-size:20px;" onclick="toggleAdmin()">⚙️</button>
    </div>
</div>

<div id="newsTicker"><div id="tickerContent">Yükleniyor...</div></div>

<div id="adminPanel">
    <h2 style="margin-bottom:20px; color:var(--accent)">⚙️ Yönetim Paneli</h2>
    <div class="panel-sec">
        <h3>👤 Kullanıcı Tanımlama (kadi:GerçekAd)</h3>
        <textarea id="data_users" placeholder="ahmet123:Ahmet Yılmaz"></textarea>
    </div>
    <div class="panel-sec"><h3>📜 Mağaza Kuralları</h3><textarea id="data_kurallar" placeholder="Örn: Geç gelmek yasaktır."></textarea></div>
    <div class="panel-sec"><h3>🛒 Kasaönü Bilgileri</h3><textarea id="data_kasaonu"></textarea></div>
    <div class="panel-sec"><h3>📩 Bekleyen Talepler</h3><div id="requestContainer"></div></div>
    <div class="panel-sec"><h3>✅ Tüm İzin Kayıtları</h3><textarea id="data_izin"></textarea></div>
    <div class="panel-sec"><h3>📢 Mağaza Duyuruları</h3><textarea id="data_magaza"></textarea></div>
    <div style="display:flex; gap:10px;">
        <button class="btn btn-accent" style="flex:1;" onclick="saveAllPanels()">💾 KAYDET</button>
        <button class="btn" style="background:#475569; color:white;" onclick="toggleAdmin()">KAPAT</button>
    </div>
</div>

<div id="chatBox"></div>

<div class="input-container">
    <input type="text" id="userInput" placeholder="Mesajınızı yazın...">
    <button class="btn btn-accent" onclick="send()">GÖNDER</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc, updateDoc, arrayUnion, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyChKcwZnw1fe_SFWy2dJA_JZOMiKghF5_o", authDomain: "ukasa1.firebaseapp.com", projectId: "ukasa1", appId: "1:929741424159:web:733f958e2fe7c13984f72a" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentUserKadi = "";
let realName = "";
let isAdmin = false;
let dbData = { izin: "", magaza: "", kasaonu: "", users: "", kurallar: "" };
let personeller = [];

onSnapshot(doc(db, "kasa", "personel"), snap => { if (snap.exists()) personeller = snap.data().liste || []; });
onSnapshot(doc(db, "kasa", "bilgiBankasi"), snap => {
    if (snap.exists()) {
        dbData = snap.data();
        document.getElementById("data_izin").value = dbData.izin || "";
        document.getElementById("data_magaza").value = dbData.magaza || "";
        document.getElementById("data_kasaonu").value = dbData.kasaonu || "";
        document.getElementById("data_users").value = dbData.users || "";
        document.getElementById("data_kurallar").value = dbData.kurallar || "";
        const haberler = (dbData.magaza || "").split('\n').filter(l => l.trim().startsWith("-")).map(l => l.trim().substring(1).trim());
        document.getElementById("tickerContent").innerText = haberler.join("    •   ") || "Duyuru yok.";
    }
});

onSnapshot(doc(db, "kasa", "talepler"), snap => {
    const cont = document.getElementById("requestContainer"); cont.innerHTML = "";
    if (snap.exists() && snap.data().liste) {
        snap.data().liste.forEach((t, i) => {
            const d = document.createElement("div"); d.style="display:flex; justify-content:space-between; background:#0f172a; padding:8px; border-radius:8px; margin-bottom:5px; border:1px solid var(--border);";
            d.innerHTML = `<span style="font-size:11px">${t}</span><button class="btn" style="background:#10b981; padding:3px 8px; font-size:10px" onclick="approveRequest('${t}', ${i})">ONAYLA</button>`;
            cont.appendChild(d);
        });
    }
});

window.login = () => {
    const k = document.getElementById("kullanici").value.trim().toLowerCase();
    const s = document.getElementById("sifre").value.trim();
    if (k === "admin" && s === "1234") { currentUserKadi = "admin"; realName = "Yönetici"; isAdmin = true; }
    else {
        const p = personeller.find(x => x.k.toLowerCase() === k && x.s === s);
        if (p) { 
            currentUserKadi = k; isAdmin = false;
            const match = (dbData.users || "").split('\n').find(l => l.toLowerCase().startsWith(k + ":"));
            realName = match ? match.split(':')[1].trim() : k;
        }
    }
    if (currentUserKadi) {
        document.getElementById("loginOverlay").style.display = "none";
        document.getElementById("welcomeText").innerText = realName.toUpperCase();
        if (isAdmin) document.getElementById("adminGear").style.display = "block";
        appendMsg(`Sistem Aktif: ${realName}`, "ai");
    } else { document.getElementById("loginError").style.display = "block"; }
};

window.openLeave = () => document.getElementById("leaveModal").style.display = "flex";
window.closeLeave = () => document.getElementById("leaveModal").style.display = "none";

window.submitLeave = async () => {
    const start = document.getElementById("leaveStart").value;
    const end = document.getElementById("leaveEnd").value;
    if (!start || !end) { alert("Lütfen tarih seçin!"); return; }
    const sDate = new Date(start); sDate.setHours(0,0,0,0);
    const eDate = new Date(end); eDate.setHours(0,0,0,0);
    if (eDate < sDate) { alert("Bitiş tarihi başlangıçtan önce olamaz!"); return; }
    let hasConflict = false;
    const onaylilar = (dbData.izin || "").split('\n');
    onaylilar.forEach(satir => {
        if (satir.includes("/") && satir.includes(":")) {
            const tarihKismi = satir.split(":").pop().trim();
            const dRange = tarihKismi.split(" / ");
            const dbS = new Date(dRange[0]); dbS.setHours(0,0,0,0);
            const dbE = new Date(dRange[1]); dbE.setHours(0,0,0,0);
            if (sDate <= dbE && eDate >= dbS) { hasConflict = true; }
        }
    });
    const talepSnap = await getDoc(doc(db, "kasa", "talepler"));
    if (talepSnap.exists()) {
        const liste = talepSnap.data().liste || [];
        liste.forEach(talep => {
            const parts = talep.split(": ");
            if (parts.length > 1) {
                const dates = parts[1].split(" / ");
                const dbS = new Date(dates[0]); dbS.setHours(0,0,0,0);
                const dbE = new Date(dates[1]); dbE.setHours(0,0,0,0);
                if (sDate <= dbE && eDate >= dbS) { hasConflict = true; }
            }
        });
    }
    if (hasConflict) { alert("❌ ÇAKIŞMA: Bu tarihlerde başka bir izin mevcut."); return; }
    const msg = `${realName.toUpperCase()}: ${start} / ${end}`;
    await updateDoc(doc(db, "kasa", "talepler"), { liste: arrayUnion(msg) });
    appendMsg(`✅ Talep iletildi: ${start} - ${end}`, "ai"); 
    closeLeave();
};

window.approveRequest = async (t, i) => {
    const newIzin = (dbData.izin || "") + "\n✅ " + t;
    await setDoc(doc(db, "kasa", "bilgiBankasi"), { ...dbData, izin: newIzin });
    const snap = await getDoc(doc(db, "kasa", "talepler"));
    let l = snap.data().liste; l.splice(i, 1);
    await updateDoc(doc(db, "kasa", "talepler"), { liste: l });
};

window.send = async () => {
    const input = document.getElementById("userInput"); const text = input.value.trim(); if (!text) return;
    appendMsg(text, "user"); input.value = "";
    if (text.toLowerCase().includes("tablo") || text.toLowerCase().includes("şift") || text.toLowerCase().includes("takvim")) { generateTable(); return; }

    let isolatedIzin = ""; let isolatedKasaonu = "";
    if (isAdmin) {
        isolatedIzin = dbData.izin || ""; isolatedKasaonu = dbData.kasaonu || "";
    } else {
        const filterKey = realName.toUpperCase();
        isolatedIzin = (dbData.izin || "").split('\n').filter(line => line.toUpperCase().includes(filterKey)).join('\n');
        isolatedKasaonu = (dbData.kasaonu || "").split('\n').filter(line => line.toUpperCase().includes(filterKey)).join('\n');
    }

    try {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": "Bearer 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", "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "llama-3.1-8b-instant",
                messages: [{ 
                    role: "system", 
                    content: `Sen Umut Salman Asistanısın. Kullanıcı: ${realName}. GİZLİLİK: Sadece bu personelin verilerini paylaş. KURALLAR: ${dbData.kurallar || "Kural girilmedi"}. VERİLER: Duyurular: ${dbData.magaza}. Kasaönü: ${isolatedKasaonu}. İzinler: ${isolatedIzin}. Eğer kullanıcı mağaza kurallarını sorarsa KURALLAR kısmındaki bilgileri kullan.` 
                }, { role: "user", content: text }],
                temperature: 0
            })
        });
        const data = await res.json(); appendMsg(data.choices[0].message.content, "ai");
    } catch (e) { appendMsg("Cevap verilemedi.", "ai"); }
};

function generateTable() {
    let ref = new Date("2026-04-28"); let today = new Date();
    let html = `<table class="shift-table"><tr><th>Tarih</th><th>Durum</th></tr>`;
    for (let i = 0; i < 30; i++) {
        let cur = new Date(); cur.setDate(today.getDate() + i);
        let diff = Math.floor((cur - ref) / 86400000);
        let cycle = ((diff % 4) + 4) % 4;
        let grp = (cycle < 2) ? `<span style="color:#60a5fa">1. GRUP</span>` : `<span style="color:#fbbf24">2. GRUP</span>`;
        html += `<tr><td>${cur.toLocaleDateString('tr-TR')}</td><td>${grp}</td></tr>`;
    }
    html += `</table>`; appendMsg(html, "ai", true);
}

window.toggleAdmin = () => document.getElementById("adminPanel").style.display = (document.getElementById("adminPanel").style.display === "flex") ? "none" : "flex";
window.saveAllPanels = async () => {
    await setDoc(doc(db, "kasa", "bilgiBankasi"), { 
        izin: document.getElementById("data_izin").value, 
        magaza: document.getElementById("data_magaza").value, 
        kasaonu: document.getElementById("data_kasaonu").value,
        users: document.getElementById("data_users").value,
        kurallar: document.getElementById("data_kurallar").value
    });
    alert("Mağaza Kuralları ve Tüm Veriler Kaydedildi!"); toggleAdmin();
};
function appendMsg(t, s, html = false) {
    const b = document.getElementById("chatBox"); const d = document.createElement("div"); d.className = `msg ${s}`;
    if(html) d.innerHTML = t; else d.innerText = t;
    b.appendChild(d); b.scrollTop = b.scrollHeight;
}
</script>
</body>
</html>
