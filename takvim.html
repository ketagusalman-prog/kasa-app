<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M4 Operasyonel Takvim Ekranı</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #0f172a; 
            --card: #1e293b; 
            --accent: #10b981; 
            --text: #f8fafc; 
            --border: rgba(255, 255, 255, 0.08); 
            --danger: #ef4444; 
            
            /* Belirgin Yeni Grup Renkleri */
            --g1-color: #2563eb; 
            --g2-color: #d97706; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 8px; width: 100%; min-height: 100vh; }
        .container { max-width: 1200px; margin: auto; width: 100%; }
        
        /* Üst Başlık Alanı */
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: var(--card);
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        h2 { color: var(--accent); font-weight: 800; font-size: 15px; }
        
        /* Takvim Navigasyon ve Panel */
        .panel { background: var(--card); padding: 12px; border-radius: 12px; border: 1px solid var(--border); width: 100%; }
        .calendar-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .nav-btn { background: var(--bg); border: 1px solid var(--border); color: white; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 800; transition: 0.2s; font-size: 12px; }
        .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
        
        /* Takvim Grid Yapısı - Tam Denk Gelme Ayarı */
        .calendar-header { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 6px; 
            margin-bottom: 8px; 
            text-align: center; 
            font-weight: 800; 
            font-size: 11px; 
            color: var(--accent); 
            width: 100%;
        }
        .calendar-grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 6px; 
            width: 100%; 
        }
        
        /* Mobil Öncelikli Gün Hücreleri */
        .cal-day { 
            background: var(--bg); 
            /* Grid kaymasını önlemek için standart border yerine inset shadow veya tüm kenarlara eşit border verdik */
            border: 1px solid var(--border);
            min-height: 85px; 
            height: auto; 
            padding: 6px; 
            border-radius: 8px; 
            position: relative; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-start;
        }
        .cal-date { font-weight: 800; font-size: 11px; margin-bottom: 4px; opacity: 0.9; display: flex; justify-content: space-between; align-items: center; }
        .cal-content { font-size: 9px; display: flex; flex-direction: column; gap: 3px; width: 100%; }
        
        /* Durum Rozetleri */
        .need-staff { 
            color: white; 
            padding: 2px 3px; 
            border-radius: 4px; 
            display: block; 
            font-weight: 800; 
            text-align: center; 
            font-size: 8px; 
            line-height: 1.2; 
            white-space: normal; 
            word-break: break-word; 
        }
        
        /* Grup Renk Çizgileri - Kaymayı Önleyecek Şekilde Düzenlendi */
        .g1-work-day { background: rgba(37, 99, 235, 0.08) !important; border-top: 4px solid var(--g1-color) !important; }
        .g2-work-day { background: rgba(217, 119, 6, 0.08) !important; border-top: 4px solid var(--g2-color) !important; }
        
        /* Boş Günlerin Hizayı Bozmaması İçin Border Dengesi */
        .cal-day-empty { opacity: 0.1; border: 1px solid transparent; }

        /* Yükleniyor Efekti */
        .loading { text-align: center; color: #94a3b8; font-weight: 600; padding: 40px; }

        /* ----------------------------------------------------------------- */
        /* MOBİL YATAY (LANDSCAPE) VE GENİŞ EKRANLAR İÇİN ESNEKLİK KURALLARI */
        /* ----------------------------------------------------------------- */
        @media (min-width: 768px) or (orientation: landscape) {
            body { padding: 20px; }
            .header-area { padding: 15px 25px; margin-bottom: 20px; }
            h2 { font-size: 22px; }
            .panel { padding: 25px; border-radius: 15px; }
            .calendar-nav { margin-bottom: 20px; }
            .nav-btn { padding: 8px 18px; font-size: 14px; }
            .calendar-header { gap: 10px; margin-bottom: 10px; font-size: 13px; }
            .calendar-grid { gap: 10px; }
            .cal-day { min-height: 125px; padding: 12px; border-radius: 10px; }
            .cal-date { font-size: 14px; margin-bottom: 6px; }
            .cal-content { font-size: 11px; gap: 4px; }
            .need-staff { font-size: 10px; padding: 3px 6px; }
            .g1-work-day { border-top: 6px solid var(--g1-color) !important; }
            .g2-work-day { border-top: 6px solid var(--g2-color) !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Üst Bar -->
    <div class="header-area">
        <h2>📅 M4 Operasyonel Takvim Kontrol Ekranı</h2>
        <div id="loadingStatus" style="font-size: 11px; color: #94a3b8;">🔄 Veriler Güncelleniyor...</div>
    </div>

    <!-- Takvim Ana Panel -->
    <div class="panel">
        <div class="calendar-nav">
            <button class="nav-btn" onclick="changeMonth(-1)">◀ Geri</button>
            <h3 id="currentMonthTitle" style="color:var(--accent); margin:0; font-weight: 800; font-size: 16px;">Aylık Durum</h3>
            <button class="nav-btn" onclick="changeMonth(1)">İleri ▶</button>
        </div>
        <div class="calendar-header">
            <div>PZT</div><div>SAL</div><div>ÇAR</div><div>PER</div><div>CUM</div><div>CMT</div><div>PAZ</div>
        </div>
        <div class="calendar-grid" id="calendarContainer">
            <div class="loading" style="grid-column: 1 / -1;">Bulut verileri yükleniyor, lütfen bekleyiniz...</div>
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwe7EKKz0_xDwP1g-Fi_X4uFvDEsR8azkXVhsKPyNBErkzUx3aCibTa5q2J8CLwRdZE/exec";
    
    let izinler = [];
    let currentViewDate = new Date();
    const BAZ_YIL = 2026, BAZ_AY = 4, BAZ_GUN = 6; 

    window.onload = async function() {
        await verileriBuluttanCek();
    };

    function formatDate(dateVal) {
        if (!dateVal) return "";
        let d = new Date(dateVal);
        if (isNaN(d.getTime())) {
            return dateVal.toString().includes('T') ? dateVal.split('T')[0] : dateVal;
        }
        let year = d.getFullYear();
        let month = String(d.getMonth() + 1).padStart(2, '0');
        let day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    async function verileriBuluttanCek() {
        try {
            document.getElementById('loadingStatus').innerText = "🔄 Veriler Güncelleniyor...";
            const response = await fetch(SCRIPT_URL + "?t=" + new Date().getTime());
            const data = await response.json();
            izinler = data.map((row, idx) => ({
                sicil: row[0], isim: row[1], grup: row[2], dilim: row[3],
                baslangic: formatDate(row[4]),
                bitis: formatDate(row[5]),
                onayVeren: row[6],
                takviye: row[7], tur: row[8],
                seciliTarihler: JSON.parse(row[9] || "[]").map(t => formatDate(t)),
                realRowIndex: idx 
            }));
            document.getElementById('loadingStatus').innerText = "✅ Güncel";
            renderCalendar();
        } catch (e) {
            console.error("Veri çekilemedi:", e);
            document.getElementById('loadingStatus').innerText = "❌ Bağlantı Hatası";
            document.getElementById('calendarContainer').innerHTML = `<div class="loading" style="grid-column:1/-1; color:var(--danger)">Veriler veri tabanından alınamadı!</div>`;
        }
    }

    function getVardiyaDurumu(tarihStr) {
        const parts = tarihStr.split('-');
        const hedon = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
        const baz = new Date(BAZ_YIL, BAZ_AY, BAZ_GUN);
        hedon.setHours(0,0,0,0); baz.setHours(0,0,0,0);
        const farkMs = hedon.getTime() - baz.getTime();
        const farkGun = Math.round(farkMs / (1000 * 60 * 60 * 24));
        let mod = farkGun % 4;
        if (mod < 0) mod += 4;
        return (mod === 0 || mod === 1) ? "1. Grup" : "2. Grup";
    }

    function changeMonth(offset) {
        currentViewDate.setMonth(currentViewDate.getMonth() + offset);
        renderCalendar();
    }

    function renderCalendar() {
        const container = document.getElementById('calendarContainer');
        container.innerHTML = '';
        const year = currentViewDate.getFullYear();
        const month = currentViewDate.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const startOffset = firstDay === 0 ? 6 : firstDay - 1;
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        document.getElementById('currentMonthTitle').innerText = new Intl.DateTimeFormat('tr-TR', { month: 'long', year: 'numeric' }).format(currentViewDate);
        
        // Boş gün dolguları - Hizayı korumak için yeni sınıf eklendi
        for (let x = 0; x < startOffset; x++) container.innerHTML += `<div class="cal-day cal-day-empty"></div>`;
        
        // Günlerin oluşturulması
        for (let day = 1; day <= daysInMonth; day++) {
            const dStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            const calisanGrup = getVardiyaDurumu(dStr);
            const gunlukKayitlar = izinler.filter(i => dStr >= i.baslangic && dStr <= i.bitis && i.grup === calisanGrup);
            
            let gunduzCount = 0, geceCount = 0, birbirCount = 0;
            gunlukKayitlar.forEach(i => {
                let lazim = (i.takviye === 'Hepsi') || (i.takviye === 'Secili' && i.seciliTarihler && i.seciliTarihler.includes(dStr));
                if (lazim) { 
                    if (i.dilim === 'Gündüz') gunduzCount++; 
                    else if (i.dilim === 'Gece') geceCount++;
                    else if (i.dilim === 'Bir-Bir') birbirCount++;
                }
            });

            const dayDiv = document.createElement('div');
            dayDiv.className = `cal-day ${calisanGrup === '1. Grup' ? 'g1-work-day' : 'g2-work-day'}`;
            
            let tHtml = gunduzCount > 0 ? `<span class="need-staff" style="background:#fbbf24; color:#000;">☀️ Gndz: ${gunduzCount}</span>` : '';
            tHtml += geceCount > 0 ? `<span class="need-staff" style="background:#475569;">🌙 Gece: ${geceCount}</span>` : '';
            tHtml += birbirCount > 0 ? `<span class="need-staff" style="background:#8b5cf6;">⚖️ 1-1: ${birbirCount}</span>` : '';

            const iznCount = gunlukKayitlar.filter(x => x.tur === 'İzinli').length;
            const rapCount = gunlukKayitlar.filter(x => x.tur === 'Raporlu').length;
            
            const grupRenkStr = calisanGrup === '1. Grup' ? 'var(--g1-color)' : 'var(--g2-color)';

            dayDiv.innerHTML = `
                <div class="cal-date">
                    <span>${day}</span>
                    <span style="font-size:8px; color:${grupRenkStr}; font-weight:800;">${calisanGrup.split(' ')[0]}.GRP</span>
                </div>
                <div class="cal-content">
                     ${(iznCount+rapCount) > 0 ? `<div style="font-size:10px; margin-bottom:1px; display:flex; gap:2px;">${iznCount>0?'🏖️'+iznCount:''} ${rapCount>0?'🏥'+rapCount:''}</div>` : ''}
                    ${tHtml}
                </div>`;
            container.appendChild(dayDiv);
        }
    }
</script>
</body>
</html>
