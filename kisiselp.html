<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M4 Personel Sistemi | Akıllı Analiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b0f1a; --card: #161e31; --accent: #3b82f6; --text: #f1f5f9; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

        #login-screen { width: 100%; max-width: 360px; padding: 40px; background: var(--card); border-radius: 28px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; outline: none; }
        
        #personel-screen { display: none; width: 100%; max-width: 400px; background: var(--card); border-radius: 30px; padding: 25px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        
        .score-container { text-align: center; margin: 20px 0; position: relative; }
        .score-val { font-size: 68px; font-weight: 800; background: linear-gradient(135deg, #60a5fa, #2563eb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
        
        /* Akıllı Durum Etiketleri */
        .badge-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        .status-badge { padding: 6px 12px; border-radius: 10px; font-size: 10px; font-weight: 800; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.1); }
        .tag-success { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border-color: rgba(16, 185, 129, 0.3); }
        .tag-danger { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border-color: rgba(239, 68, 68, 0.3); }
        .tag-warning { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border-color: rgba(245, 158, 11, 0.3); }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-box { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .stat-label { font-size: 9px; color: #64748b; display: block; margin-bottom: 5px; font-weight: 800; text-transform: uppercase; }
        .stat-value { font-size: 16px; font-weight: 700; color: #fff; }

        .analysis-box { margin-top: 15px; padding: 15px; border-radius: 20px; background: rgba(59, 130, 246, 0.05); border: 1px dashed rgba(59, 130, 246, 0.3); }
        .analysis-text { font-size: 12px; color: #94a3b8; line-height: 1.5; }

        .note-box { background: rgba(245, 158, 11, 0.1); border-left: 4px solid #f59e0b; padding: 15px; border-radius: 12px; font-size: 13px; color: #fbbf24; margin-top: 15px; }
        
        .btn-main { width: 100%; padding: 15px; border-radius: 14px; border: none; background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; font-weight: 800; cursor: pointer; margin-top: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2 style="color: var(--accent); font-weight: 800; margin-bottom: 10px;">M4 PORTAL</h2>
        <input type="text" id="sicilInput" placeholder="Sicil No">
        <input type="password" id="sifreInput" placeholder="Şifre">
        <button class="btn-main" onclick="sistemeGiris()">VERİLERİ ANALİZ ET</button>
    </div>

    <div id="personel-screen">
        <div style="text-align: center;">
            <h1 id="pIsim" style="font-size: 20px; font-weight: 800; color: #fff;">---</h1>
            <p id="pAltBilgi" style="font-size: 11px; color: #64748b; margin-top: 4px;">---</p>
        </div>

        <div class="score-container">
            <div id="pSkor" class="score-val">0.0</div>
            <p style="font-size: 10px; font-weight: 800; color: #94a3b8; letter-spacing: 2px; margin-top: 5px;">BAŞARI SKORU</p>
        </div>

        <div class="badge-row" id="badgeRow">
            <!-- Rozetler Buraya Gelecek -->
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <span class="stat-label">Toplam Fiş</span>
                <span id="pFiş" class="stat-value">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Vardiya</span>
                <span id="pVardiya" class="stat-value">---</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">TL Satış</span>
                <span id="pTl" class="stat-value">0 ₺</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Euro Satış</span>
                <span id="pEuro" class="stat-value">0 €</span>
            </div>
        </div>

        <div class="analysis-box">
            <p class="analysis-text">
                <strong>Akıllı Analiz:</strong> <span id="pAnalizMetni">Grup ortalamaları hesaplanıyor...</span>
            </p>
        </div>

        <div id="notKutusu" class="note-box" style="display:none;">
            <strong>Yönetici Notu:</strong> <span id="pNot"></span>
        </div>

        <button onclick="location.reload()" style="background:none; border:none; color:#475569; width:100%; margin-top:20px; cursor:pointer; font-weight:700; font-size:11px;">Oturumu Kapat</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSy...", authDomain: "ukasa1.firebaseapp.com", projectId: "ukasa1" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxWYGZ7rWKB-IRjL2t1JW8QDqIPRFAZzcVbGVwKO13pYwNhAB86tklN5BqjLRv0dxYJEA/exec";

        window.sistemeGiris = async () => {
            const sicil = document.getElementById("sicilInput").value.trim();
            const sifre = document.getElementById("sifreInput").value.trim();
            if (!sicil || !sifre) return;

            const snap = await getDoc(doc(db, "kasa", "personel"));
            const liste = snap.exists() ? snap.data().liste : [];
            const user = liste.find(x => x.k === sicil && x.s === sifre);

            if (user) {
                document.getElementById("login-screen").classList.add("hidden");
                document.getElementById("personel-screen").style.display = "block";
                hesaplaVeGoster(sicil);
            } else { alert("Hatalı giriş!"); }
        };

        async function hesaplaVeGoster(sicilNo) {
            try {
                const res = await fetch(SCRIPT_URL);
                const dataGlobal = await res.json();
                const EUR_RATE = 36.50;

                const p = dataGlobal.find(x => String(x.sicil) === String(sicilNo));
                if (!p) return;

                const n = (v) => parseFloat(v) || 0;
                
                // 1. Grup Ortalamalarını Hesapla (Admin Kodundaki Mantık)
                const fisList = dataGlobal.map(x => n(x.fis));
                const meanFis = fisList.reduce((a, b) => a + b, 0) / (fisList.length || 1);
                const totalCiroGenel = dataGlobal.reduce((acc, x) => acc + n(x.tl) + (n(x.euro) * EUR_RATE), 0);
                const totalFisGenel = fisList.reduce((a, b) => a + b, 0) || 1;
                const grupFisBasiCiro = totalCiroGenel / totalFisGenel;

                // 2. Personel Verileri
                const fis = n(p.fis);
                const ciro = n(p.tl) + (n(p.euro) * EUR_RATE);
                const personelFisBasiCiro = ciro / (fis || 1);
                const isNight = (p.vardiya || "").toLowerCase().includes("gece");

                // 3. Başarı Skoru Formülü
                let score = ((fis * 1.5) * 0.60) + ((ciro / 1500) * 0.40);
                const finalScore = isNight ? score * 1.6 : score;

                // 4. Arayüzü Güncelle
                document.getElementById("pIsim").innerText = p.isim;
                document.getElementById("pAltBilgi").innerText = `SICIL: ${p.sicil} | ${p.magaza || 'M4'}`;
                document.getElementById("pSkor").innerText = finalScore.toFixed(1);
                document.getElementById("pFiş").innerText = Math.round(fis);
                document.getElementById("pVardiya").innerText = p.vardiya || "---";
                document.getElementById("pTl").innerText = n(p.tl).toLocaleString('tr-TR') + " ₺";
                document.getElementById("pEuro").innerText = n(p.euro).toLocaleString('tr-TR') + " €";

                // 5. Akıllı Rozetler ve Verimlilik Analizi
                const badgeRow = document.getElementById("badgeRow");
                badgeRow.innerHTML = "";

                // Başarı Durumu (Kritik Fiş Analizi)
                if (fis < (meanFis * 0.8)) {
                    badgeRow.innerHTML += `<span class="status-badge tag-danger">KRİTİK FİŞ</span>`;
                    document.getElementById("pAnalizMetni").innerText = "Fiş sayınız grup ortalamasının altında. Fiş hızınızı artırmalısınız.";
                } else {
                    badgeRow.innerHTML += `<span class="status-badge tag-success">BAŞARILI TEMPO</span>`;
                    document.getElementById("pAnalizMetni").innerText = "Fiş sayınız stabil. Müşteri akışını iyi yönetiyorsunuz.";
                }

                // Verimlilik Analizi (Fis Başı Ciro - Upsell)
                const esik = grupFisBasiCiro * 0.85;
                if (personelFisBasiCiro < esik) {
                    badgeRow.innerHTML += `<span class="status-badge tag-warning">DÜŞÜK VERİMLİLİK</span>`;
                    document.getElementById("pAnalizMetni").innerText += " Kasa önü satışlarını (upsell) artırarak fiş başı cironuzu yükseltebilirsiniz.";
                } else if (personelFisBasiCiro > (grupFisBasiCiro * 1.2)) {
                    badgeRow.innerHTML += `<span class="status-badge tag-success">YÜKSEK VERİMLİLİK</span>`;
                }

                // 6. Yönetici Notu
                if (p.not && p.not.length > 2) {
                    document.getElementById("notKutusu").style.display = "block";
                    document.getElementById("pNot").innerText = p.not;
                }

            } catch (e) { alert("Veri çekilemedi!"); }
        }
    </script>
</body>
</html>
